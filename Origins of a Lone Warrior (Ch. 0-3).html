<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origins of a Lone Warrior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Fixed dark palette: a title screen and a night-reading page look the same in light and dark mode. */
:root{
  --bg-in:#152117; --bg-mid:#0B180F; --bg-out:#06120D;
  --title:#D8DFD8; --title-hi:#E8EFE8; --sub:#B9C3B8; --dim:#7F8B80; --body:#CBD4CB; --accent:rgba(232,239,232,.55);
  --display:'Cinzel Decorative','Cinzel','Trajan Pro',Georgia,serif;
  --text:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--sub);font-family:var(--text);
  background:radial-gradient(ellipse 75% 80% at 50% 48%,var(--bg-in) 0%,var(--bg-mid) 58%,var(--bg-out) 100%) #06120D}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-out);z-index:10}
a:focus-visible{outline:1px solid var(--dim);outline-offset:3px}

canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* Title screen */
.stage{position:relative;height:100%;display:flex;overflow-y:auto}
.col{position:relative;z-index:1;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem 1.5rem}
h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--title);
  text-shadow:0 0 28px rgba(216,223,216,.14);animation:rise 2.6s ease-out both}
h1 .pre{display:block;font-size:clamp(.95rem,2.6vw,1.5rem);letter-spacing:.42em;margin-right:-.42em;color:var(--sub);margin-bottom:.9rem}
h1 .main{display:block;font-size:clamp(2.1rem,7.4vw,5rem);letter-spacing:.08em;margin-right:-.08em;line-height:1.05}
@keyframes rise{from{opacity:0;filter:blur(7px);letter-spacing:.2em}to{opacity:1;filter:blur(0)}}

.prompt{margin:3.6rem 0 0;max-height:3rem;overflow:hidden;font-size:clamp(1rem,2.2vw,1.2rem);letter-spacing:.04em;color:var(--sub);
  transition:opacity .5s ease,max-height 1.2s ease,margin-top 1.2s ease}
.prompt span{display:block;padding-left:.04em;opacity:0;animation:appear 1.6s ease 2.4s forwards,pulse 3.6s ease-in-out 4s infinite}
@keyframes appear{to{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.35}}
.menu-open .prompt{opacity:0;max-height:0;margin-top:0}
.slot{width:100%;max-height:0;margin-top:0;overflow:hidden;transition:max-height 1.2s ease,margin-top 1.2s ease}
.menu-open .slot{max-height:44rem;margin-top:3rem}
.menu{list-style:none;margin:0 auto;padding:.25rem 0;max-width:40rem;text-align:center;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
.menu-open .menu{opacity:1;visibility:visible;transition:opacity .9s ease .5s}
.menu a{position:relative;display:block;padding:.55rem 2.4rem;text-wrap:balance;font-size:clamp(1.1rem,2.4vw,1.4rem);letter-spacing:.05em;line-height:1.3;
  color:var(--sub);text-decoration:none;transition:color .25s ease}
.menu a::before,.menu a::after{content:"\2013";position:absolute;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .25s ease}
.menu a::before{left:.8rem}
.menu a::after{right:.8rem}
.menu a:hover,.menu a.on,.menu a:focus-visible{color:var(--title-hi)}
.menu a:hover::before,.menu a:hover::after,.menu a.on::before,.menu a.on::after,
.menu a:focus-visible::before,.menu a:focus-visible::after{opacity:.8}

/* Reader */
.reader{display:none;position:fixed;inset:0;z-index:2;overflow-y:auto;outline:none;
  padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.5rem calc(3rem + env(safe-area-inset-bottom,0px));
  animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reading .reader{display:block}
.reading .stage{display:none}
.reader-in{max-width:38rem;min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.back{display:inline-block;padding:.55rem 1.6rem;border:1px solid rgba(185,195,184,.3);border-radius:2px;color:var(--sub);text-decoration:none;font-size:1.1rem;letter-spacing:.08em;transition:color .25s,border-color .25s}
.back:hover,.back:focus-visible{color:var(--title-hi);border-color:var(--accent)}
.chead{text-align:center;margin:4rem 0 3.5rem}
.cnum{margin:0 0 1rem;font-size:1.1rem;letter-spacing:.3em;margin-right:-.3em;color:var(--sub)}
.ctitle{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(1.4rem,4.2vw,2.3rem);
  letter-spacing:.06em;line-height:1.3;color:var(--title);text-shadow:0 0 24px rgba(216,223,216,.12)}
.prose{flex:1;width:100%;font-size:clamp(1.2rem,2.3vw,1.4rem);line-height:1.25;color:var(--body)}
.prose p{margin:0 0 .67em;white-space:pre-wrap;tab-size:3em;hyphens:manual}
.prose p.in{text-indent:3em}
.prose p.c{text-align:center}
.prose p.r{text-align:right}
.prose p.j{text-align:justify}
.prose b{font-weight:700}
.prose i{font-style:italic}
.prose .brk{text-align:center;color:var(--dim);letter-spacing:.5em;margin:2rem 0}
.prose em{font-style:italic;color:var(--title-hi)}
.prose strong{font-weight:700;color:var(--title-hi)}
.pager{display:flex;flex-wrap:wrap;gap:1rem;width:100%;margin-top:3rem}
.pager a{display:block;flex:1 1 15rem;min-width:0;overflow-wrap:anywhere;padding:.9rem 1.2rem;text-align:center;border:1px solid rgba(185,195,184,.3);border-radius:2px;color:var(--sub);text-decoration:none;font-size:1.1rem;line-height:1.35;transition:color .25s,border-color .25s}
.pager a small{display:block;margin-bottom:.25rem;font-size:.95rem;letter-spacing:.04em;color:var(--dim)}
.pager a:hover,.pager a:focus-visible{color:var(--title-hi);border-color:var(--accent)}
.pager .next{margin:0}

.mbtn{position:absolute;top:calc(1.25rem + env(safe-area-inset-top,0px));right:1.5rem;padding:.55rem 1rem;font:inherit;font-size:1rem;letter-spacing:.06em;
  color:var(--sub);background:none;border:1px solid rgba(185,195,184,.3);border-radius:2px;cursor:pointer;transition:color .25s,border-color .25s}
.mbtn[hidden]{display:none}
.mbtn:hover,.mbtn:focus-visible{color:var(--title-hi);border-color:var(--accent)}
.mbtn:focus-visible{outline:1px solid var(--dim);outline-offset:3px}
@media (max-width:30rem){.mbtn{position:static;margin-bottom:1rem}}
.music{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.music iframe{width:200px;height:200px;border:0}
/* Chapter colour themes, sampled from the track artwork.
   abyss = Oscillation (Chapter 4): teal shafts of light fading to near-black on the right.
   chill = The Storm That Speaks (Chapter 5): the deep-water blue from the top of the artwork,
   with the pale misty lower half deepened so white body text stays readable. */
body.t-abyss{--title:#EAF3F1;--title-hi:#FFFFFF;--sub:#BFD6D3;--dim:#7FA3A1;--body:#D5E4E2;--accent:#4DB6AC;
  background:linear-gradient(90deg,#0F454B 0%,#0F454B 28%,#0A2E31 55%,#051E20 80%,#021616 100%) #021616}
body.t-abyss::before{background:linear-gradient(90deg,#0F454B 0%,#0F454B 28%,#0A2E31 55%,#051E20 80%,#021616 100%)}
body.t-chill{--title:#F6FAFA;--title-hi:#FFFFFF;--sub:#DCEBEF;--dim:#BCD3DA;--body:#F1F7F8;--accent:#FAAFB0;
  background:linear-gradient(180deg,#1F697F 0%,#2B768D 50%,#3A8296 100%) #2B768D}
body.t-chill::before{background:#206B80}
@media (prefers-reduced-motion:reduce){
  h1,.reader{animation:none}
  .prompt span{animation:none;opacity:.9}
  .slot,.menu{transition:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="col">
    <h1><span class="pre">Origins of a</span><span class="main">Lone Warrior</span></h1>
    <p class="prompt"><span>– Press any key to continue –</span></p>
    <div class="slot"><nav aria-label="Chapters"><ul class="menu" id="menu"></ul></nav></div>
  </div>
</div>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="music" id="music" aria-hidden="true"></div>

<article class="reader" id="reader" tabindex="-1">
  <button class="mbtn" id="mbtn" type="button" aria-pressed="true" hidden>Music: on</button>
  <div class="reader-in">
    <a class="back" href="#chapters">Chapters</a>
    <header class="chead"><p class="cnum" id="cnum"></p><h2 class="ctitle" id="ctitle"></h2></header>
    <div class="prose" id="prose"></div>
    <nav class="pager" id="pager" aria-label="Chapter navigation"></nav>
  </div>
</article>

<script>
/* ============ YOUR NOVEL ============
   One entry per chapter, in reading order.
   Paragraphs are separated by a blank line. *word* makes italics, **word** makes bold.
   A line holding only * * * makes a scene break.
   Chapters converted from a Word file use html: instead of text:, which keeps the
   document's paragraph gaps, indents, blank lines, bold and italics as written.
   Until the real text goes in, each chapter is a blank page.
   Optional per chapter: music:'<YouTube video id>' plays as background audio,
   theme:'abyss' | 'chill' swaps the background colours (see body.t-* in the CSS). */
function placeholder(n){
  return '';
}
var CHAPTERS=[
  {n:0,title:'Humble Beginnings',html:`<p class="in j">The sounds of the sea eased me deeper into my slumber, in my vivid dream I saw another ship coming closer into the vicinity of ours. I could hear chanting… “We’re masters of the oceans wide~ custodians of relentless tide~ for the authority we fight~ within this dark a blazing light- Hurrah, hurrah, three cheers for the cause~” Sung by the people onboard the ship.</p>
<p class="j">I see their ship shooting Canon balls directly aimed towards our ship.</p>
<p class="in j">*<i>BOOM-*</i></p>
<p class="j">Everything suddenly turns pitch black, and I wake up to the voice of-</p>
<p class="e">&nbsp;</p>
<p class="j">“Rise and shrine Crew! The shores of Erisia are well within our sights.”</p>
<p class="j">I wake up to the words of someone familiar to me, I should go down to the ship’s lower deck to look for the voice that called me.</p>
<p class="j">When I got to the lower deck, I saw Cap’n Beckham waiting for me. “Feeling caught in the waves this morning, Ali? Yer late for your trainin’! Draw your sword and let’s get a move on.” He says</p>
<p class="j">“Oh, my apologies Cap’n”, I muttered as he readies the equipment for today’s training.</p>
<p class="j">This time he aids me in refining my overall swordsmanship as well as training me to be physically stronger, to prepare for any looming danger that we might come across in the island of Erisia.</p>
<p class="j">“There ya go mate! Lookin’ sharp already! Keep this up and ye’ll be ready to take on the dangers of the land and sea alone!”</p>
<p class="j">“Are there other ways for me to train?” I ask</p>
<p class="j">“You could grab some of those trainin’ gear I left in the gear chest and get some solo trainin’ in. He remarks.<b> </b><b>“</b>But enough of that, let’s not keep your crewmates waitin’.”</p>
<p class="j">Very well, Cap’n</p>
<p class="j">We both went up to the main deck of the ship to meet with the other crewmates.</p>
<p class="j">“Nothing quite like the smell of the sea, aye? Ye did great in yer training today, Altrius. Ye can take a moment to chat with yer fellow crewmates if ye like, just come back my way when you’ve had enough.”</p>
<p class="j">I then go to chat with a few of my crewmates.</p>
<p class="e">&nbsp;</p>
<p class="j">“Oi’ve got… urgh. Oi need, a moment. Oi’ll be fine. Exclaimed by the mate sitting in a corner of the deck.</p>
<p class="j">“What’s wrong, Pete?”</p>
<p class="j">“Th’ waves aren’t kind to me gut, Ali. Gah, ol Frank tried feeding me a mushy stew, but- urgh. Tis not a help. Th’ stew beckons my downfall. Ali.” Pete explains</p>
<p class="j">“You should rest up, go inside the cabins, sitting in a corner like this won’t help your gut.”</p>
<p class="in j">*<i>The man gives a weak thumbs-up toward you, clutching his stomach with the other hand*</i></p>
<p class="j">From the middle of the ship, you hear: “Aye Altrius!”</p>
<p class="j">I turn around and see it’s the first mate of the crew. “Oh Filigree, what’s up?”</p>
<p class="j">“Tis great to see you again. Apologies for devastating ye in our last spar, I heard Beckham ramblin’ about it from ‘ere. He said somethin’ about fearin’ for yer ability to live in Etrea with that display.” She says while having this devious smile on her face.</p>
<p class="j">“We just finished training, I won’t go down that easily anymore.”</p>
<p class="j">“Perfect! Maybe someday you can attain and master an <b>attunemen</b><b>t</b>– oh I see Beckham tryna call for you, ye should probably return to him”</p>
<p class="j">Oh alright, I gotta go then.</p>
<p class="e">&nbsp;</p>
<p class="j">“Ye get a good enough chinwag out there, then?” Beckham asks.</p>
<p class="j">“Yeah, I think so.”</p>
<p class="j">“As I was sayin’ earlier, you’ll have an opportunity to take up new <b>Talents. </b>You may also take up what’re known as <b>Mantras. </b>They’re fragments of the <b>Song </b>that ye can call upon to wield in battle. Ye’ll surely come across them as ye increase your power.”</p>
<p class="j">*As he explained, I understood the basics of chanting mantras. I then try to channel my <b>Ether </b>to my hand and aimed towards the empty sea.*</p>
<p class="in j">*<i>Crack</i><i>*</i><i> *Crackle*</i>, suddenly a burst of icicles comes out of my palm.</p>
<p class="j">“Pwoah! Yer a natural, mate. Seems like all my training is finally paying off, eh?”</p>
<p class="j">“What’s Next?”</p>
<p class="j">“Heh, well next up we have my favor-“</p>
<p class="j">We both suddenly heard the sounds of canons firing and chanting, eerily similar to the one I heard in my dream.</p>
<p class="j">“No… The Authority couldn’t have… EVERYONE GET BELOW THE DECK, NOW!”</p>
<p class="in j">*<i>BOOM-*</i></p>
<p class="j">My vision then fades to black. We didn’t have time to do anything. Why didn’t we see the Authority’s ship looming closer and closer to ours? I can feel burns and bruises all over my body. Did the ship get destroyed that quickly? God I can’t even open my eyes to see-. I then lose my consciousness…</p>`},
  {n:1,title:'The Castaway',html:`<p class="in j" style="line-height:1.45">My new journey with the crew had barely even started and it seemed to have ended before we could even reach the island we travelled days to reach. I thought it would be a smooth sail until those Authority bastards came in and ruined it all. Could we have foreseen the ambush? Hell would I know, I’m not even sure myself if I’m already in the afterlife just waiting for a light to show or if anyone from the crew even survived.</p>
<p class="j" style="line-height:1.45">A light begins to shine bright in front of me, I try to chase it and..</p>
<p class="in j" style="line-height:1.45">*<i>Arghhh</i><i>*</i></p>
<p class="j" style="line-height:1.45"><i></i>I wake up in a bed, in a room I don’t recognize, with half my body wrapped in bandages.</p>
<p class="j" style="line-height:1.45"><i>Huh? I’m alive? How lucky must I be to survive an ambush like that. How long has it been?</i> I muttered under my breath.</p>
<p class="j" style="line-height:1.45">I force myself to stand up and check whether there’s anyone I could talk to about my situation. I go out of my room to see a that I’m in what seems to be a sanctuary for warriors such as myself. I see someone standing near one of the pillars of the inn we were in, I’ll try asking him.</p>
<p class="j" style="line-height:1.45">“Hey, how did I end up here?” I ask the man in robes</p>
<p class="j" style="line-height:1.45">“Oh, you’re finally awake. You washed up on the shores of this isle a couple weeks ago, may I ask for your name?” Says the man</p>
<p class="j" style="line-height:1.45">“The name’s Altrius Velad, Ali for short.”</p>
<p class="j" style="line-height:1.45">He scoffs then says, “Well nice to meet you Ali, I’m Aristo, a vigil initiate of the <b>Isle of Vigils</b>.” He then asks, “Say, do you remember anything before you lost consciousness?”</p>
<p class="j" style="line-height:1.45">“I remember that I was on a ship with my crew, heading for an island before another ship shot us down.” I reply.</p>
<p class="j" style="line-height:1.45">“Do you remember your crew? Your crewmates? Or your captain” He asks again.</p>
<p class="j" style="line-height:1.45">“Now that you mention it, I don’t remember the name of our crew, any of my crewmates nor the name of my captain” I say as I try to remember something that seemed to be gone from my memories.</p>
<p class="j" style="line-height:1.45">“That’s a shame, well if you seek to find out more about your forgotten past, I suggest you regain your strength through training. The <b>Vigil</b><b>s</b><b> </b>would be more than happy to train you.”</p>
<p class="j" style="line-height:1.45"><i>As much as I want to leave and explore the world to find out more of my past, I fear that I might be too weak for now. I should follow his advice and train before I set out for the sea</i></p>
<p class="j" style="line-height:1.45">“What’s the purpose for the <b>I</b><b>sle of Vigils</b>?” I ask reluctantly.</p>
<p class="j" style="line-height:1.45">“I guess I haven’t properly explained to you yet. The <b>V</b><b>igils</b> are soldiers in training, soon to be positioned in the ranks of the <b>Etris</b><b> </b>army, although some decide to stay instead of going to the army, so they become swordsmen of the isle, as we are also a separate force from the Etrean army. The main purpose of the isle is to be a sanctuary for initiates and vigil soldiers alike.” He explains.</p>
<p class="j" style="line-height:1.45">“Where should I go to start my training?” I ask</p>
<p class="j" style="line-height:1.45">“Well, you can start by going to the temple sparring hall to train with the other initiates. After that you can go out to learn an <b>attunement</b><b>” </b>He replies with a generous smile on his face.</p>
<p class="j" style="line-height:1.45">“Thanks for everything, Aristo. I’ll get going now.” I say while shaking the man’s hand.</p>
<p class="j" style="line-height:1.45">“No problem, if you need anything you can come talk to me any time.”</p>
<p class="j" style="line-height:1.45">After that informative chat with Aristo, I should head to the sparring hall to start my training.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">I enter a temple in the middle of the isle where the other vigil initiates were going. I assumed I was in the right direction and went inside. I then see multiple people sparring while a man in white watches over them. I then get approached by an initiate.</p>
<p class="j" style="line-height:1.45">“Oi lad, ye new ‘round ‘ere?” Asked by the initiate.</p>
<p class="j" style="line-height:1.45">“Yea I am, I’m looking to get some training here. The name’s Ali by the way.” I say to the initiate.</p>
<p class="j" style="line-height:1.45">“Oh, ye lookin’ to train, eh? Well Ali, let’s see how ye fair up against me. Get a sword from the rack, put on yer protective gear and let’s dance. I’m Heathcliff for yer information, don’t forget it”</p>
<p class="j" style="line-height:1.45">“Sure, why not? I was looking for a spar anyway.” I say with no doubts in my mind that I could take him</p>
<p class="j" style="line-height:1.45">We then began sparring…</p>
<p class="in j" style="line-height:1.45"><i>*Clank* *crash* *thud*</i></p>
<p class="j" style="line-height:1.45">These sounds of parrying and slashing echoed through the temple as we had nearly finished up our clash. Our broadswords collided in a bind after a furious flurry of strikes from Heathcliff.</p>
<p class="j" style="line-height:1.45">“Not bad, eh? Yer defense is pretty good! You sure you don’t want to go on offense?” He screamed</p>
<p class="j" style="line-height:1.45">I scoff as I was merely sizing him up to see how he fights.</p>
<p class="j" style="line-height:1.45">	<i>*Crash*</i></p>
<p class="j" style="line-height:1.45">He then comes in even faster with more slashes, trying to overwhelm my guard. I parried and redirected each slash to the point that he’s completely wide open for a counter from my blade.</p>
<p class="j" style="line-height:1.45">I thrusted at his chest with my broadsword but he somehow dodged it.</p>
<p class="in j" style="line-height:1.45"><i>*Thud*</i></p>
<p class="j" style="line-height:1.45">I get hit on the shoulder with his sword and I fall on to the ground.</p>
<p class="j" style="line-height:1.45">“Yer attack was too telegraphed lad. Anyone with a pair of working eyes could see that!” He arrogantly says while helping me get up.</p>
<p class="j" style="line-height:1.45">As we had finished our skirmish, the man in white robes approached us.</p>
<p class="j" style="line-height:1.45">“Ah, you must be that <b>Pathfinder</b> the vigils found washed up on the shore. You showed some good defense there, but you lack offense. Impressive from someone that just had their first spar here.” He says in a calm manner</p>
<p class="j" style="line-height:1.45">“I must say, you and Heathcliff have some chemistry, you two should be training partners. I shall make training regiments for the both of you, please wait here.” He adds.</p>
<p class="j" style="line-height:1.45"><i>I felt dumbfounded for a good minute there until Heathcliff snapped me back to reality</i></p>
<p class="j" style="line-height:1.45">“Oi lad, ya must have some promising potential if ye got noticed by the Instructor.”</p>
<p class="j" style="line-height:1.45">“Oh, he’s the master here? I shoulda known from his stance and aura that encompassed around the temple.”</p>
<p class="j" style="line-height:1.45">“Hah, ya better get used to it for the next few months since its just your first day ‘ere.”</p>
<p class="c" style="line-height:1.45">*<i>After some time pass…</i>*</p>
<p class="j" style="line-height:1.45">“Ah there you two are, here’s your training plans, I’ve written down what you both should improve on and the methods on how to improve them. You both are now training partners, as I was saying earlier, I believe you two have some chemistry when it comes to your fighting styles, so you two could learn a lot from each other.” The Instructor explains.</p>
<p class="j" style="line-height:1.45">“Thank you, Instructor.” We both say while bowing towards the Instructor.</p>
<p class="j" style="line-height:1.45">We then took the training plans and sparred a few more times until we’ve decided to rest up for today and continue tomorrow.</p>
<p class="c" style="line-height:1.45">*<i>Two</i><i> month</i><i>s</i><i> later*</i></p>
<p class="j" style="line-height:1.45">Can’t believe it’s already been a whole 2 months since I started training and living in this Isle. I’ve honed my skills and built strong relationships with my peers. Me and Heathcliff have already reached our goals in our training regiments and we have decided to part ways for now to learn different <b>attunements</b><b>, </b><b>talents</b>, and <b>abilities</b>.</p>
<p class="j" style="line-height:1.45">After bidding farewell to my training buddy, I went and greeted Aristo.</p>
<p class="j" style="line-height:1.45">“Hey Aristo, it’s been a while.” I say to him with joy in my voice.</p>
<p class="j" style="line-height:1.45">“You caught me off guard there, Ali. I assume you’ve completed your training in the temple?” He asks</p>
<p class="j" style="line-height:1.45">“Yea I’ve already finished everything on my list. Anyway, I came to ask about the <b>attunements</b>.”</p>
<p class="j" style="line-height:1.45">“Oh, you want to attain one I presume? To put it bluntly, they are elemental powers that manipulate different parts of your surroundings and body to expel its specific effect. There are four main attunements that one can attain. <b>Flamecharm</b>, the ability to ignite the ether in your body to shoot out flames. <b>Galebreath</b>, the power to control the air around you and the air inside your lungs.</p>
<p class="j" style="line-height:1.45"><b>Frostdraw</b>, the controlling of temperature by rapidly freezing the air around you. And lastly, <b>Thundercall</b>, it works by taking energy and turning it into electricity, it could be kinetic energy, energy from magnetic fields and other sources.</p>
<p class="j" style="line-height:1.45">That concludes the main four, there are more that are manmade, and some are even born with theirs. You can go to Galemaster Frisk if you wish to learn more about galebreath. She resides in a camp near the outskirts of the isle. You could also go to the city of <b>E</b><b>tris</b> to seek the Frostdraw master. For the other attunements you must seek out the masters for yourself.”</p>
<p class="j" style="line-height:1.45">As he explained everything I needed to know about attunements, I pulled out my notebook to write notes down so I can’t forget them.</p>
<p class="j" style="line-height:1.45">“Thanks Aristo, I’ll head out to learn more about this world. Where do you think I should go after attaining an attunement?”</p>
<p class="j" style="line-height:1.45">He thinks for a moment, before answering: “<b>Erisia</b>, you should go to the island of Erisia. Rumor has it that there's riches to be found on Erisia for adventuring types like yourself, although do be careful, there’s said to be monsters there. At least, I consider you to be an adventuring type given that you were washed up on a random shore. You'll be able to find Erisia by sailing out from the docks.”</p>
<p class="j" style="line-height:1.45">“Alright, thanks again Aristo, you’ve helped me a lot ever since I washed up on this Isle. I’ll come to visit from time to time to see what’s changed and what stayed the same around here.”</p>
<p class="j" style="line-height:1.45">I walk back to the Inn while waving back to Aristo. I’ll start packing up and say my goodbyes to the vigils. It’s soothing to know that there’s still hope and kindness around this world. I think I’ll start my journey by going to the city of <b>Etris</b>, to learn more about the world and the people in it. Maybe I’ll attain frostdraw as my first attunement.</p>
<p class="j" style="line-height:1.45">I visited the temple one last time before heading out, to pay my respects to the Instructor and the other higher ups in the Vigils. I then head to the docks to ask a shipwright:</p>
<p class="j" style="line-height:1.45">“How much is it for a sloop? And do you know which direction to sail in to reach Etris?</p>
<p class="j" style="line-height:1.45">“A sloop’s 50 notes my friend. Etris is east from the isle, keep sailing in that direction and you should find a gate leading to the city. You can have this map and compass to aid you in your voyage.” He replies</p>
<p class="j" style="line-height:1.45">“Alright, I’ll take a sloop. And thanks for the directions.”</p>
<p class="j" style="line-height:1.45">As the shipwright sets up the sloop. I look at the map and mark the path I should sail.</p>
<p class="j" style="line-height:1.45">Finally, my actual journey begins here. I still don’t remember anything about my life before the ambush on my crew. Maybe I’ll find out soon if I ask locals about that attack, but that isn’t the most important matter at the moment. What matters is I get to Etris safe, get the information I need about the world’s current state and head back out towards Erisia, an island said to be full of riches and eerie danger. I’ll take the risk so I can become stronger and wiser in this forsaken world..</p>`},
  {n:2,title:'Beginning of a New Voyage',html:`<p class="j" style="line-height:1.45">	The sea breeze travels along my vigil robes and my restless body. It’s been 2 hours or so since I started my voyage towards the city of Etris. I keep seeing these strange whirlpools around me, it’s probably best to avoid them as I don’t know where they could take me. This fog has also been bothering me the entire trip, I can’t see a damn thing out here, it’s good that my compass still works though. Thankfully I still know how to steer a ship, and from my estimates, I should reach the gate leading to the city in about thirty minutes…</p>
<p class="c" style="line-height:1.45"><i>*20 minutes pass*</i></p>
<p class="j" style="line-height:1.45">I finally see an outline of a large sea gate it feels like I’ve been lost at sea for hours on end. Welp I should speed up and go there as soon as possible, I’m really hungry..</p>
<p class="j" style="line-height:1.45">I went through the gate and saw a city built atop mountains. I didn’t think Etris was going to be this large. I docked my sloop at their shore and greeted their shipwright:</p>
<p class="j" style="line-height:1.45">“Good afternoon fellow etrean, may I ask, where is the path toward the main city of Etris?”</p>
<p class="j" style="line-height:1.45">The shipwright happy to see another person visit Etris says: “Ah good afternoon to you as well, I assume from your attire that you’re a vigil swordsman, yes? The city of Etris welcomes thee, you may follow the path to the left of us to reach the main city.”</p>
<p class="j" style="line-height:1.45">I thank him for the warm welcome and proceed to follow the path he directed me towards to reach the city. As I eventually reach the main city, I mutter:</p>
<p class="j" style="line-height:1.45"><i>Woah, this city’s huge, the architecture looks really intricate. I wonder how they were able to build this in the mountains</i><i>.</i></p>
<p class="j" style="line-height:1.45">Well, I should start by finding the inn here, I might spend a couple days here seeing how big the city is, I might need more time to explore it.</p>
<p class="j" style="line-height:1.45">I then take a few minutes to find the inn, I saw a weapon’s store, a bookstore, a blacksmith, and a restaurant called Lance’s Food. I’ll keep their locations in mind since I might need to visit all of them. After a couple more minutes I eventually find the inn, it was right across from the bookstore, I wonder how I didn’t notice it maybe I need to get my eyesight checked too…</p>
<p class="j" style="line-height:1.45">I then go inside the inn and meet the innkeeper:</p>
<p class="j" style="line-height:1.45">“Hello, I’d like to book a room here.” I told the woman at the front desk.</p>
<p class="j" style="line-height:1.45">“Sure, there’s a free room up in the third floor. We usually charge 5 notes for a room but seeing as you’re a vigil swordsman, we can book you one for free.” She says in a welcoming tone.</p>
<p class="j" style="line-height:1.45">“Ah, it seems like being one of the vigils has its many perks when residing in Etris. Thanks for the accommodation, miss.” I reply.</p>
<p class="j" style="line-height:1.45">After getting myself a room I went to check out Lance’s Food, Lance himself was a pretty cheerful guy, he really put pride in his cooking and it was evident when I took the first bite on his Megurger.</p>
<p class="j" style="line-height:1.45">I then went to the weaponry and bought myself a new Zweihander, since the sword I got from the vigils has already been beaten up after training with it for a month straight without doing any maintenance.</p>
<p class="j" style="line-height:1.45">I think I should go back to my accommodation and rest up for the day, I’m going to need a clear mind when I inquire about the city’s history and any mystery behind the island of Erisia. First thing I’ll do tomorrow is go to the bookstore it’s probably the best place to get that information, they might have books about these islands.</p>
<p class="j" style="line-height:1.45">And so, I went back to my room and rested for the day.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="c" style="line-height:1.45">*<i>10 Hours Later*</i></p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">	<i>*yawn* *sigh*</i></p>
<p class="j" style="line-height:1.45">“It’s morning already? I fell asleep pretty fast, I guess it’s because I was tired from my voyage to get here” I mutter as I still feel sleepy.</p>
<p class="j" style="line-height:1.45">I dragged my still tired body towards the bookstore. There I met the bookkeeper.</p>
<p class="j" style="line-height:1.45">“Hey, do you know any history about this city?” I questioned.</p>
<p class="j" style="line-height:1.45">“Uhh hello?” I suppose the bookkeeper was lost in thought.</p>
<p class="j" style="line-height:1.45">“Oh! Uh, hello. Pardon me, I was rather deep in thought.”</p>
<p class="j" style="line-height:1.45"><i>Well</i><i>, </i><i>my assumption was right about that…</i></p>
<p class="j" style="line-height:1.45">“About what?” I questioned again.</p>
<p class="j" style="line-height:1.45">“These old books are more of a passing fancy of mine, but I've heard there's an order of scholars that devote their life to researching the <b>O</b><b>ld world</b>.” He exclaims.</p>
<p class="j" style="line-height:1.45">“Is there anything you can tell me about Etris?”</p>
<p class="j" style="line-height:1.45">“If you head past the inn, you'll find the Lord Regent's estate. I wouldn’t advise entering without an invitation, however. Even a bookish fool such as myself knows when I am not welcome.” He answered in reply.</p>
<p class="j" style="line-height:1.45">“Who is this Lord Regent exactly?”</p>
<p class="j" style="line-height:1.45">“The Lord Regent is the 'acting regent' of Etrea. That is to say, he is not the prophesied King, but he still holds absolute power over Etrea. In recent years, he has sequestered himself away in his palace, rarely making an appearance. Some worry that he has grown ill, but considering that his duties have not been passed on to any of his officials, I doubt this is the case.” He explains.</p>
<p class="j" style="line-height:1.45"><i>I have a weird feeling about this “regent” that rules over </i><i>etrea</i><i>, he seems oddly mysterious for someone leading a kingdom like this.</i><i> It’s best that I don’t investigate this yet. I haven’t even endured my first actual skirmish</i><i>,</i><i> yet.</i></p>
<p class="j" style="line-height:1.45">“Do you know anything about Erisia?” I ask</p>
<p class="j" style="line-height:1.45">“Well, it was said to be a driftland. An island that moves in and out of the said <b>Voidsea</b>. The <b>Voidsea</b> itself is dangerous to any sailor, as it covers the surrounding sea of the <b>Luminants</b> and will appear when you sail too far off from the surrounding islands. If you start seeing fog and whirlpools around you, you might be inside of the most dangerous part of these oceans.”</p>
<p class="j" style="line-height:1.45"><i>So</i><i>,</i><i> I was in the </i><i>voidsea</i><i> when I saw those whirlpools and when I was encompassed in a thick fog. I’m impressed that I didn’t see anything else weird about it.</i></p>
<p class="j" style="line-height:1.45">“I heard Erisia was a land with riches in it, I was hoping to get there and snag some so I could better my gear.” I say to the bookkeeper.</p>
<p class="j" style="line-height:1.45">With a surprised look in his face, he muttered: “You’re brave to think that you can just go there and grab some of its riches and leave without a scratch. That land has lost to time, it’s now made a battleground for warriors who know not why they fight.”</p>
<p class="j" style="line-height:1.45">With a delighted look in my eyes, I said: “It seems to me that it’s just another challenge for me to conquer. Thanks for the knowledge old man, I now know what to do next”</p>
<p class="j" style="line-height:1.45">And that that thing I needed to do was go to Erisia and see the lurking danger in it for myself. Although I still have things to do here in Etris before I go, one of them being, finding the master of frost to see if I have what it takes to attain Frostdraw for myself. As well as ask around if anyone knew about the authority ambushing a crew ship, I still need to know what really happened that day.</p>
<p class="j" style="line-height:1.45">After thanking the bookkeeper, I went to ask around if people knew anything about the ambush, but to no avail. I guess I have to put that thought in the back of my mind for now.</p>
<p class="j" style="line-height:1.45">I saw an etrean guard standing near the path leading to the regent’s palace, maybe I should go ask him about where to find the master of frost.</p>
<p class="j" style="line-height:1.45">“Hey sir, do you know where the master of frost resides?” I asked</p>
<p class="j" style="line-height:1.45">“Oh, you’re looking to learn Frostdraw? Well, Frostmaster Nell resides in the Alchemist’s Lodge, go to the middle of the city and take a left you should see a path up and around a mountain near the general store. That path should take you to the lodge.”</p>
<p class="j" style="line-height:1.45">I nodded and shook his hand in thanks. I then followed his directions to see the master.</p>
<p class="j" style="line-height:1.45">I entered the lodge to be greeted by her:</p>
<p class="j" style="line-height:1.45">“Can you really protect anything that you hold dear as you are now?” She asks</p>
<p class="j" style="line-height:1.45">“What do you mean?”</p>
<p class="j" style="line-height:1.45">“You lack the means to protect anything at all. I can teach you how. Will you take up the mantle of the Frostdrawer?”</p>
<p class="j" style="line-height:1.45">Thrilled, I excitedly asked: “Yes, what would you have me do?”</p>
<p class="j" style="line-height:1.45">“Drink this potion, it contains frigid prisms that bear frost energy.”</p>
<p class="j" style="line-height:1.45">I took the potion, drank it and waited for something to happen.</p>
<p class="j" style="line-height:1.45">“Hmm? Nothing happened? Well that just means that you’ll awaken your attunement later down the line.” She said while having a curious tone in her voice</p>
<p class="j" style="line-height:1.45">“I guess I have to endure some battles first before I can unlock it. Thanks anyways master, I’ll be on my way now” I reply</p>
<p class="j" style="line-height:1.45">“Come back to me once you have attained frostdraw, we have much to do once the time comes, student.”</p>
<p class="j" style="line-height:1.45">Afterwards I went back to my room in the inn to pack up so I can set sail towards Erisia. With all the necessary preparations done, I went to the docks, bid farewell to the shipwright, marked my path and went on another voyage, this time to Erisia. The thrill of finally stepping foot in that land makes me itch for battle against any danger that I might come across there. And the mystery behind it makes it even better for my desire to explore this world.</p>`},
  {n:3,title:'Driftland of The Voidsea',html:`<p class="j" style="line-height:1.45">	The sea breeze travels along my body once again. As I look at my map and calculate when I could reach Erisia. I come to a conclusion that I should arrive in no less than 30 minutes. That’s a lot better than the two hours and twenty minutes I took to get from the Isle of Vigils to Etris. As I have that realization, I sit down and eat my Mushroom Bisque while I wait to see a silhouette of an island getting closer.</p>
<p class="c" style="line-height:1.45"><i>*Some time after finishing the meal*</i></p>
<p class="j" style="line-height:1.45">Exactly as I finish my meal, I see it. The shores of Erisia. I then fix the sail on my sloop and speed towards the shore.</p>
<p class="j" style="line-height:1.45">Eventually, I was able to dock my ship on the shore, and step foot on the <b>driftland</b>. Looking up it seemed like this island has an upper area. <i>So currently I’m in </i><i>L</i><i>ower </i><i>E</i><i>risia.</i> As I enter the gate near the shore, I was abruptly welcomed by a group of bandits.</p>
<p class="j" style="line-height:1.45">“Ey! This guy sailed alone all the way here. Let’s get ‘em boys!” One of the bandits screamed, ordering his companions to attack me.</p>
<p class="j" style="line-height:1.45">I then pulled the Zweihander from my back, go into my stance and immediately cut off the head of one of the bandits. One by one they came near my great sword’s range and soon four of them were already dead at my feet. Either having severed heads, a stabbed torso, or got severely beaten to a pulp. Only the bandit leader remained.</p>
<p class="j" style="line-height:1.45">“Gah! H-how did you kill them so easily… No matter I’m their leader after all, I will kill you, take your gear, and avenge my companions!” He screamed while charging at me with his dagger.</p>
<p class="j" style="line-height:1.45">I easily redirected his trajectory and threw him to a stone wall. I then disarmed him by kicking his hand that held the dagger. Next, I gave him a flurry of rapid punches, all targeting his upper body.</p>
<p class="j" style="line-height:1.45">“Did’ya really think you could kill me and nick all my gear that easily?” I whispered to his ear, before I grabbed my great sword and stabbed him through the chest to finally kill him.</p>
<p class="j" style="line-height:1.45"><i>So much for a warm welcome, </i>I muttered</p>
<p class="j" style="line-height:1.45">I then carried on my trek up towards Upper Erisia…</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">After a quick walk, I discovered a large cave system labelled as “<b>The Viper’s Jaw” </b>by a sign near the entrance. Being the adventurous person that I am, I expelled any thoughts of putting myself in danger by exploring this cave, and went inside without a care in the world.</p>
<p class="j" style="line-height:1.45">While venturing through the cave I heard screaming, not from a person but from a creature. It sounded more like a roar from a predator. Looking for my next challenge, I try to find the source of this roar. I turn a few corners and saw something through a hole. It was at least ten feet tall, had white skin, standing on two legs and had arms almost twice the length of its legs. I couldn’t clearly see its head but it had teeth similar to a shark and corals stuck to its back.</p>
<p class="j" style="line-height:1.45"><i>So, this is one of the dangers that they said lurked in Erisia, </i>I thought while the creature was going near the cave section where I stood.</p>
<p class="j" style="line-height:1.45"><i>Well,</i><i> </i><i>it</i><i>’</i><i>s already coming near me, I have no choice but to fight it.</i></p>
<p class="j" style="line-height:1.45">As the creature turned the corner, I met it with a jumping slash that sliced off one of its arms. It then let out a deafening roar before cowering in to a ball, exposing the corals in its back, I thought I was free to attack but suddenly-</p>
<p class="j" style="line-height:1.45">	<i>*Pffffffffttttt* *Thud*</i></p>
<p class="j" style="line-height:1.45"><i>The damn creature shot what seemed to be sharp needles from the holes of its corals. Some of them hit my torso and arms, but my robes</i><i> are</i><i> thick </i><i>and had a layer of armor under it to further lessen the damage I suffered.</i><i> </i>I thought to myself</p>
<p class="j" style="line-height:1.45">After that barrage of needles, the shark-like creature went to me while swinging its arm, but I parry its slash. It then tried to kick me into the cave walls, but I dodge it by side stepping to its left, I cut it’s left arm afterwards. His kick is too slow to hit me so I began giving it slashes to its chest, staggering the creature. Finally, I end the encounter by slicing it’s head off with my great sword.</p>
<p class="j" style="line-height:1.45"><i>Huh, that was easier than I imagined, I just didn’t expect the guy to be able to shoot things out from its corals.</i></p>
<p class="j" style="line-height:1.45">With that battle ending, I pulled out the needles it had shot at me and quickly tended to my wounds. Afterwards I continue my exploration inside the Viper’s Jaw..</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">After that ordeal with the creature, I ventured deeper into the caves and found what seemed to be an old archive. I picked a book at random and decided to read it.</p>
<p class="j" style="line-height:1.45"><i>Archivist Journal: 'Megalodaunt'</i><i>, ah so the creature I just fought is called a </i><b><i>M</i></b><b><i>egalodaunt</i></b><i>. </i>I muttered to myself after seeing crude sketches of it inside the journal.</p>
<p class="j" style="line-height:1.45">A passage from the journal reads: <i>“While not appearing to be reasonably intelligent creatures, they have a strong sense of social hierarchy, and their place in their 'society,' if it </i><i>could be called that.</i><i> </i><i>Megalodaunts are particularly known for being social creatures, evident by how a Megalodaunt can become an Alpha within a pack, though they are more often observed to be alone rather than the contrary.</i><i>”</i></p>
<p class="j" style="line-height:1.45"><i>So, these creatures somehow have signs of intelligence when it comes to their social hierarchy. They seem to choose a leader base on strength alone. Quite impressive…</i></p>
<p class="j" style="line-height:1.45"><i>This archive is home to books that I could really use, I’ll try to find another book worth reading.</i></p>
<p class="j" style="line-height:1.45">A passage from, <i>Children of the Aftertide I</i><i> -</i> <i>a foreword by Mira Sokolof</i><i>, </i>reads the following:</p>
<p class="j" style="line-height:1.45"><i>“</i><i>The world we live in - the world after the</i><i> </i><b><i>Old World</i></b><i>, the</i><i> </i><b><i>Canticlysm</i></b><i>, and the </i><b><i>Tides</i></b><i>- is a world without harmony and peace, a place of great turmoil and unrest. The surface is slowly turning into a graveyard of once-great cultures, as the few surviving ones vie for supremacy in a sea-sundered land.</i></p>
<p class="j" style="line-height:1.45"><i>I myself, Mira Sokolof, am a descendant of the </i><b><i>Celtor</i></b><i> who survived the </i><b><i>Submergence of Celtor </i></b><i>by fortune of being away from the city during the catastrophe. Despite that, the loss of our heartland - its wholesale disappearance to the </i><b><i>Depths </i></b><i>below, - left a great wound in our collective psyche, and a rift in our cultural memory.</i><i>”</i></p>
<p class="j" style="line-height:1.45"><i>Hmmm. Looking at how old this foreword is, it was most likely written sometime after the era of the </i><b><i>Tides</i></b><i>, since we currently live in the era of the </i><b><i>New World</i></b><i>. Mira speaks of this </i><b><i>Submergence of Celtor </i></b><i>and its disappearance to the </i><b><i>Depths </i></b><i>below, I assume Celtor was a kingdom similar to Etrea, but how does an entire kingdom just sink into the depths of the ocean?</i><i></i></p>
<p class="j" style="line-height:1.45"><i>I put that thought in the forefront of my mind as I look for the last book I could read.</i></p>
<p class="j" style="line-height:1.45">I picked up another book titled: <i>Lumen’s Folklore: Volume ‘Attunement’</i></p>
<p class="j" style="line-height:1.45">The book tells me how people back in the era of the old world used the attunements in their daily life.</p>
<p class="j" style="line-height:1.45"><i>”</i><i>If</i><i> </i><i>you happen to live within a large city or settlement, such as Etris, for example, you’ve likely had a well-cooked, delicious meal before. A large number of these meals are masterfully cooked by expert</i><i> </i><b><i>Flamecharmers</i></b><i>, who focus their craft not on violence, but the creation of delicacy.</i></p>
<p class="j" style="line-height:1.45"><i>Meat does not last forever, and one such resource the citizens of Etrea have discovered to maintain it is </i><b><i>Frostdraw </i></b><i>to freeze such perishable goods.</i><i> It </i><i>has also seen use in the preservation of artifacts by freezing them within contained chambers in order to maintain their safety and integrity.</i><i>”</i></p>
<p class="j" style="line-height:1.45"><i>So, people relied on attunements back then to do daily tasks, I wonder if this had any repercussions against the people of the old world. Since it was mentioned before that the </i><b><i>Song </i></b><i>and the </i><b><i>Attunements </i></b><i>were a gift to humanity. Maybe reliance on these gifts later costed them greatly</i><i>…</i></p>
<p class="j" style="line-height:1.45"><i>I should </i><i>probably </i><i>get going by now, I have yet to reach Upper Erisia, more secrets might be waiting for me there. </i>I said to myself after putting the books I gathered in my pack.</p>
<p class="j" style="line-height:1.45">I climbed up a hole just outside the archive to continue my journey. Eventually I reached the surface once more after some brief encounters with more megalodaunts in the caves.</p>
<p class="j" style="line-height:1.45">I stood atop a mountain and what I saw were, buildings submerged in a weird green liquid as well as ruins and gardens. After climbing down the mountain I came from, I took a closer look at the liquid, it seemed to emit steam and felt hot when I was close to it. I could only guess it was acid.</p>
<p class="j" style="line-height:1.45">As I was walking, I was met with a large stone golem. As I approached it, it suddenly bore bright eyes and shot a laser from its core. I barely dodged that laser. Before I knew it, it was spinning its arms trying to hit me once again. I ran past it and once it stopped spinning, I lodged my Zweihander in to its core, making it scream loudly before collapsing into stone.</p>
<p class="j" style="line-height:1.45"><i>Damn that caught me off guard, didn’t think a stone golem would randomly bear life and attack me. </i>I muttered after the golem had fallen on to the ground.</p>
<p class="j" style="line-height:1.45">I then continued my venture towards another part of Upper Erisia.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="c" style="line-height:1.45"><i>*After some time*</i></p>
<p class="j" style="line-height:1.45">I stumbled upon an old temple, it looks to have gone to ruin. I walk in from the big gate and got met by a black towering creature with a lamp-like head and a slender, skeletal appearance. It shined its light at me disorienting me for a moment until I saw another light, what came out of it was an angel-like humanoid creature with an unsettling looking mask and two wings, it drew its lance from its back and starting rushing at me.</p>
<p class="j" style="line-height:1.45"><i>Its attacks are swift, I have to stick to defense and find an opening</i>, I thought to myself.</p>
<p class="j" style="line-height:1.45">After parrying all of its attacks, I disarmed the angel by cutting off one of its hands, as it dropped its lance I met it with two slashes from my great sword, hitting its chest in an ‘X’ pattern. It went down after that exchange.</p>
<p class="j" style="line-height:1.45"><i>It seems like the </i><b><i>Watcher</i></b><b><i> </i></b><i>was the one that summoned the angel after flashing me with its light. </i>I say while referring to the lamp head creature that seemingly disappeared after I killed the angel.</p>
<p class="j" style="line-height:1.45">Next, I went inside the temple. I saw multiple chandelier-like objects fallen from the ceiling it looks to have housed something within it. I saw a man in the middle of the temple looking like he’s trying to decipher some writings on the wall.</p>
<p class="j" style="line-height:1.45">He seemed to have noticed me and asked:</p>
<p class="j" style="line-height:1.45">“Ah another <b>Pathfinder</b>?”</p>
<p class="j" style="line-height:1.45">“I got called one many times before, but I don’t know what they are.” I reply</p>
<p class="j" style="line-height:1.45">“A Pathfinder is someone who explores these <b>Driftlands</b>. Some of us are scavengers, some are historians, and some are bounty hunters.”</p>
<p class="j" style="line-height:1.45">“I guess by that definition you could say that I am one. Anyway, what're you doing here?” I exclaimed</p>
<p class="j" style="line-height:1.45">“I've been searching this Temple for the 'Forge of Sin'. It was written to be in the peaks of Erisia, but someone or <i>something</i> seems to have dragged it away... The marks don't seem fresh though, it must've been pulled away some time ago, perhaps during the last time the island <b>drifted</b> into one of the Luminants?”</p>
<p class="j" style="line-height:1.45">“The last time it drifted?”</p>
<p class="j" style="line-height:1.45">“These islands are known to drift in and out of the <b>Voidsea </b>over the years. Pathfinders have been looking for Erisia for decades. Though, all of that time spent searching just for <b>T</b><b>he Forge</b> to be missing? Maybe this coincides with the <b>G</b><b>reat </b><b>T</b><b>ragedy</b> that befell this place.” He explains.</p>
<p class="j" style="line-height:1.45">“Wait, what do you mean by the Great Tragedy and The Forge?”</p>
<p class="j" style="line-height:1.45">“Yes… From what I can see, the golems function as a sort of security system. They're able to discern man from monster, but they aren't powered by Thundercall. Something else makes them function - as if the stones themselves have been given life. The Forge or better known as the <b>Forge of Sin</b>... An artifact once dredged up from the deep and kept in this temple. Legends say the Forge enabled its wielder to shape not only metal, but the <i>souls of men</i>.”</p>
<p class="j" style="line-height:1.45">“Is it possible that someone took the Forge of Sin and used it to steal the souls of men after killing them. Then using the same forge, they put the souls of the men they killed inside the golems.” I asked confidently.</p>
<p class="j" style="line-height:1.45">“Hmm you might be right about how the golems are powered. But I think the method they used to gather the souls was they used the golems to capture people. As I find it hard to believe that such advanced constructs run wild on their own, someone must have given them the order, no?” He replied</p>
<p class="j" style="line-height:1.45">“Ah yes, there must have been signs of bloodshed otherwise. They must’ve used the Forge of Sin to order the golems as well. Thanks for the information, fellow Pathfinder” I say while shaking his hand then abruptly leaving the temple.</p>
<p class="j" style="line-height:1.45"><i>Come to think of it, the golem I fought was near a path leading somewhere, since he mentioned that the golems now act as a sort of security system, I should follow the path.</i><i> </i>I muttered to myself</p>
<p class="j" style="line-height:1.45">I went back to the burning stone gardens…</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">After heading back, I followed the path where the golem I destroyed used to stand. Many more golems tried to block my way, but I knew how to take care of them.</p>
<p class="j" style="line-height:1.45">Finally, I reached what seemed like a manor of sorts. Its exterior consisted of a massive bridge that led to it, patches of grass on the corner of the paths with some tall bushes, stone pillars and a gate.</p>
<p class="j" style="line-height:1.45">I went inside to be greeted with mindless servants, they seemed to have gone insane and attack anything on sight. They looked to have signs of being experimented on, which I assume is the reason why they’re insane.</p>
<p class="j" style="line-height:1.45"><i>As much as I pity all of you, you are all standing in my way to finding the truth about the forge. </i>I say to them before equipping my great sword and killing them.</p>
<p class="j" style="line-height:1.45">Afterwards, I stood on top of an elevator, leading deeper into the manor.</p>
<p class="j" style="line-height:1.45"><i>I should ready myself for what I’m about to see down here. </i>I say under my breath as I pull the lever to bring me down into the manor.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">As the elevator reached the bottom floor, I was greeted with even more mindless servants, and two black golems that seemed to be more powerful than the ones outside the manor.</p>
<p class="j" style="line-height:1.45">I killed and destroyed all of the mindless servants and golems in my way, and ventured deeper until I saw purple flames emitted from one of the rooms.</p>
<p class="j" style="line-height:1.45">I went inside the room and what I saw… I couldn’t believe what I was witnessing. It was a laboratory filled with tubes that had people inside of them, all the tubes were connected to a large circular relic, emitting purple flames. I could only assume it was the <b>Forge of Sin</b>.</p>
<p class="j" style="line-height:1.45">In the middle of the room I saw a man, with green hair, dressed in a grey coat with glasses, gauntlets on his hands and a green bell by his hip. He sees me dumbfounded staring at his lab work and says:</p>
<p class="j" style="line-height:1.45">“So, you're the one running about tripping my alarms, hm? Care to explain yourself?”</p>
<p class="j" style="line-height:1.45">”I came here from Etrea to look for secrets, and from what I learned, you stole the Forge of Sin.” I reply</p>
<p class="j" style="line-height:1.45">“That thing is finally making its move. hm? I'd thought it would come personally, but the Lord Regent must see me, as a mere agent's workload.”</p>
<p class="j" style="line-height:1.45">“Huh? Agent? For the Lord Regent? I merely came here to see what you were doing with The Forge.” I exclaimed with confusion in my tone.</p>
<p class="j" style="line-height:1.45">“Everything I can do to stop the oncoming catastrophe, you indolent worm. With it, I turn useless fools like you into something of use... You don't know what I do for all mankind. Everyone will know my name, <b>Duke Ishamon Erisia </b>as the savior of lumen!”</p>
<p class="j" style="line-height:1.45">He then surrounds himself with a shield of Galebreathe, then tried to attack me.</p>
<p class="j" style="line-height:1.45">I parried his punch and tried to counter, but his shield was protecting him, I have no idea how to break it but to just keep hitting it and hope it breaks. I exchange blows with him until he suddenly starts rising slowly in the air before encompassing me in a gale ball and punching me back quite a distance.</p>
<p class="j" style="line-height:1.45">He then sends out a slash of wind that covered half of his lab. In doing so, he cut open some of the tubes that had mindless servants inside, letting them go out to help the duke in this battle.</p>
<p class="j" style="line-height:1.45">“Seriously!? Getting some goons to help you out in the middle of a duel?” I scream at him</p>
<p class="j" style="line-height:1.45">“You vigils and your honor, just a mere thought to make you seem noble.” He replies as he creates an aero spear to launch at me.</p>
<p class="j" style="line-height:1.45">I dodge it and it hit some of the mindless servants behind me.</p>
<p class="j" style="line-height:1.45">“How dumb must you be to hit your own goons” I scoff</p>
<p class="j" style="line-height:1.45">“ENOUGH!” He screams while stomping the ground and creating a massive wave of wind up from the ground.</p>
<p class="j" style="line-height:1.45">I dodge it by rolling to the side and immediately attacked him, finally breaking his shield.</p>
<p class="j" style="line-height:1.45">He gets knocked back and I swoop in for another slash that hits his chest.</p>
<p class="j" style="line-height:1.45">“GAH! You impudent little INSECT!” He screams again, while he pulls the bell from his hip to activate it, conjuring two golem arms.</p>
<p class="j" style="line-height:1.45">“So that’s how you created the golems huh? By using your bell and the Forge of Sin-”</p>
<p class="j" style="line-height:1.45">He cuts me off by rushing forward with wind and unleashing a punch. I get hit with the punch and got sent to a wall.</p>
<p class="j" style="line-height:1.45">	*<i>Ptew* *</i> <i>Splatter</i><i>*</i></p>
<p class="j" style="line-height:1.45">I spit out blood, before guarding myself once more expecting another attack from the Duke.</p>
<p class="j" style="line-height:1.45">He flashsteps in front of me to try and hit me with a strong left. I parry it and kick him to the middle of the lab.</p>
<p class="j" style="line-height:1.45">I then rush towards him, delivering multiple slices to his upper body until he parries my blade, shattering it, then hits an uppercut with his golem arm.</p>
<p class="j" style="line-height:1.45"><i>	*Bweh* *gasp* *huff* *pant*</i></p>
<p class="j" style="line-height:1.45">I then spit out even more blood while gasping for air.</p>
<p class="j" style="line-height:1.45">“Finally had enough, Vigil?” He asks me</p>
<p class="j" style="line-height:1.45">Before I know it, I cover one of my bruises with my hand and feel frost appearing on my bruise to stop the bleeding…</p>
<p class="j" style="line-height:1.45">In that moment I realized I attained frostdraw. I quickly made three daggers and threw them at duke.</p>
<p class="j" style="line-height:1.45"><i>	*Gah!*</i></p>
<p class="j" style="line-height:1.45">All three daggers hit him, I then conjure a glaive of ice, performing a flurry of hits that sent him back.</p>
<p class="j" style="line-height:1.45">He then creates a spear out of wind and stabs me with it, but I lunge at him, grabbing his neck, while conjuring ice spikes piercing through his torso.</p>
<p class="j" style="line-height:1.45">We both drop to the ground, barely clinging to life until we both bleed out. My vision becomes blurry, I feel my soul getting grabbed by two dark figures, they then successfully tear my soul from my body and drag me down into the depths below. Everything turns black again. <i>Is this really… How I die?</i></p>`},
  {n:4,title:'Below The Sea, Layer 1: Thalassophobia',text:placeholder(4),music:'Y3lF2hL5geg',theme:'abyss'},
  {n:5,title:'Even Deeper, Layer 2: The Ethereal Chill',text:placeholder(5),music:'IA4N_loA13A',theme:'chill'}
];

(function(){
  var body=document.body, menu=document.getElementById('menu'), reader=document.getElementById('reader');
  var BOOK='Origins of a Lone Warrior', open=false, idx=0, links=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  CHAPTERS.forEach(function(c){
    var li=document.createElement('li'), a=document.createElement('a');
    a.href='#chapter-'+c.n; a.textContent='Chapter '+c.n+': '+c.title;
    li.appendChild(a); menu.appendChild(li); links.push(a);
  });
  links.forEach(function(a,i){
    a.addEventListener('mouseenter',function(){setOn(i)});
    a.addEventListener('focus',function(){setOn(i)});
  });

  function setOn(i){
    idx=(i+links.length)%links.length;
    links.forEach(function(a,n){a.classList.toggle('on',n===idx)});
  }
  function openMenu(){ if(open) return; open=true; body.classList.add('menu-open'); }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,' ')}
  function render(text){
    return text.split(/\n\s*\n/).map(function(p){
      p=p.trim(); if(!p) return '';
      if(/^(\*\s*\*\s*\*|---)$/.test(p)) return '<div class="brk" aria-hidden="true">* * *</div>';
      return '<p>'+fmt(p)+'</p>';
    }).join('');
  }

  var wrap=document.getElementById('music'), mbtn=document.getElementById('mbtn'), track=null, want=true;
  function stopTrack(){ wrap.textContent=''; track=null; }
  function playTrack(id){
    if(track===id&&wrap.firstChild) return;
    stopTrack(); if(!id) return;
    var f=document.createElement('iframe');
    f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&controls=0&playsinline=1';
    f.allow='autoplay; encrypted-media'; f.title='Background music'; f.tabIndex=-1;
    wrap.appendChild(f); track=id;
  }
  function syncMusic(c){
    mbtn.hidden=!c.music;
    mbtn.textContent='Music: '+(want?'on':'off'); mbtn.setAttribute('aria-pressed',String(want));
    if(c.music&&want) playTrack(c.music); else stopTrack();
  }
  mbtn.addEventListener('click',function(){
    want=!want;
    if(current>=0) syncMusic(CHAPTERS[current]);
  });

  var current=-1;
  function show(i){
    var c=CHAPTERS[i], prev=CHAPTERS[i-1], next=CHAPTERS[i+1];
    current=i; body.classList.add('reading');
    body.classList.remove('t-abyss','t-chill'); if(c.theme) body.classList.add('t-'+c.theme);
    syncMusic(c);
    document.getElementById('cnum').textContent='Chapter '+c.n;
    document.getElementById('ctitle').textContent=c.title;
    document.getElementById('prose').innerHTML=c.html||render(c.text);
    var pg='';
    if(prev) pg+='<a class="prev" href="#chapter-'+prev.n+'"><small>Previous chapter</small>Chapter '+prev.n+': '+esc(prev.title)+'</a>';
    if(next) pg+='<a class="next" href="#chapter-'+next.n+'"><small>Next chapter</small>Chapter '+next.n+': '+esc(next.title)+'</a>';
    document.getElementById('pager').innerHTML=pg;
    document.title='Chapter '+c.n+': '+c.title+' | '+BOOK;
    reader.scrollTop=0; reader.focus({preventScroll:true});
  }
  function home(){
    var was=body.classList.contains('reading');
    body.classList.remove('reading','t-abyss','t-chill'); current=-1; document.title=BOOK; stopTrack(); mbtn.hidden=true;
    if(was) openMenu();
  }
  function route(){
    var m=/^#chapter-(\d+)$/.exec(location.hash), i=-1;
    if(m) CHAPTERS.forEach(function(c,n){ if(String(c.n)===m[1]) i=n; });
    if(i>=0) show(i); else home();
  }
  window.addEventListener('hashchange',route);

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(current>=0){
      if(e.key==='Escape') location.hash='#chapters';
      else if(e.key==='ArrowLeft'&&CHAPTERS[current-1]) location.hash='#chapter-'+CHAPTERS[current-1].n;
      else if(e.key==='ArrowRight'&&CHAPTERS[current+1]) location.hash='#chapter-'+CHAPTERS[current+1].n;
      return;
    }
    if(!open){ if(e.key==='Shift'||e.key==='Tab') return; e.preventDefault(); openMenu(); return; }
    if(e.key==='ArrowDown'){e.preventDefault(); setOn(idx+1); links[idx].focus({preventScroll:true});}
    else if(e.key==='ArrowUp'){e.preventDefault(); setOn(idx-1); links[idx].focus({preventScroll:true});}
    else if(e.key==='Enter'&&document.activeElement!==links[idx]){e.preventDefault(); location.hash=links[idx].getAttribute('href');}
  });
  document.getElementById('stage').addEventListener('click',openMenu);

  route();

  /* Drifting dust */
  var cv=document.getElementById('dust'), cx=cv.getContext('2d'), P=[], W=0, H=0;
  function size(){
    var d=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0);
  }
  function seed(){
    P=[]; var n=Math.round(Math.min(70,W*H/16000));
    for(var i=0;i<n;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,
      vx:(Math.random()-.5)*.12,vy:-.03-Math.random()*.12,a:.04+Math.random()*.2,t:Math.random()*6.28});
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      if(!still){p.x+=p.vx; p.y+=p.vy; p.t+=.012;
        if(p.y<-4)p.y=H+4; if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;}
      cx.globalAlpha=p.a*(0.6+0.4*Math.sin(p.t));
      cx.fillStyle='#D8DFD8';
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  size(); seed(); draw();
  window.addEventListener('resize',function(){size(); seed(); if(still) draw();});
})();
</script>
</body>
