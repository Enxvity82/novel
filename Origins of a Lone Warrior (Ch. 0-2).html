<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Origins of a Lone Warrior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Fixed dark palette: a title screen and a night-reading page look the same in light and dark mode. */
:root{
  --bg-in:#152117; --bg-mid:#0B180F; --bg-out:#06120D;
  --title:#D8DFD8; --title-hi:#E8EFE8; --sub:#B9C3B8; --dim:#7F8B80; --body:#CBD4CB;
  --display:'Cinzel Decorative','Cinzel','Trajan Pro',Georgia,serif;
  --text:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--sub);font-family:var(--text);
  background:radial-gradient(ellipse 75% 80% at 50% 48%,var(--bg-in) 0%,var(--bg-mid) 58%,var(--bg-out) 100%) #06120D}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-out);z-index:10}
a:focus-visible{outline:1px solid var(--dim);outline-offset:3px}

canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* Title screen */
.stage{position:relative;height:100%;display:flex;overflow-y:auto}
.col{position:relative;z-index:1;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem 1.5rem}
h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--title);
  text-shadow:0 0 28px rgba(216,223,216,.14);animation:rise 2.6s ease-out both}
h1 .pre{display:block;font-size:clamp(.95rem,2.6vw,1.5rem);letter-spacing:.42em;margin-right:-.42em;color:var(--sub);margin-bottom:.9rem}
h1 .main{display:block;font-size:clamp(2.1rem,7.4vw,5rem);letter-spacing:.08em;margin-right:-.08em;line-height:1.05}
@keyframes rise{from{opacity:0;filter:blur(7px);letter-spacing:.2em}to{opacity:1;filter:blur(0)}}

.prompt{margin:3.6rem 0 0;max-height:3rem;overflow:hidden;font-size:clamp(1rem,2.2vw,1.2rem);letter-spacing:.04em;color:var(--sub);
  transition:opacity .5s ease,max-height 1.2s ease,margin-top 1.2s ease}
.prompt span{display:block;padding-left:.04em;opacity:0;animation:appear 1.6s ease 2.4s forwards,pulse 3.6s ease-in-out 4s infinite}
@keyframes appear{to{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.35}}
.menu-open .prompt{opacity:0;max-height:0;margin-top:0}
.slot{width:100%;max-height:0;margin-top:0;overflow:hidden;transition:max-height 1.2s ease,margin-top 1.2s ease}
.menu-open .slot{max-height:44rem;margin-top:3rem}
.menu{list-style:none;margin:0 auto;padding:.25rem 0;max-width:40rem;text-align:center;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
.menu-open .menu{opacity:1;visibility:visible;transition:opacity .9s ease .5s}
.menu a{position:relative;display:block;padding:.55rem 2.4rem;text-wrap:balance;font-size:clamp(1.1rem,2.4vw,1.4rem);letter-spacing:.05em;line-height:1.3;
  color:var(--sub);text-decoration:none;transition:color .25s ease}
.menu a::before,.menu a::after{content:"\2013";position:absolute;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .25s ease}
.menu a::before{left:.8rem}
.menu a::after{right:.8rem}
.menu a:hover,.menu a.on,.menu a:focus-visible{color:var(--title-hi)}
.menu a:hover::before,.menu a:hover::after,.menu a.on::before,.menu a.on::after,
.menu a:focus-visible::before,.menu a:focus-visible::after{opacity:.8}

/* Reader */
.reader{display:none;position:fixed;inset:0;z-index:2;overflow-y:auto;outline:none;
  padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.5rem calc(3rem + env(safe-area-inset-bottom,0px));
  animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reading .reader{display:block}
.reading .stage{display:none}
.reader-in{max-width:38rem;min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.back{display:inline-block;padding:.55rem 1.6rem;border:1px solid rgba(185,195,184,.3);border-radius:2px;color:var(--sub);text-decoration:none;font-size:1.1rem;letter-spacing:.08em;transition:color .25s,border-color .25s}
.back:hover,.back:focus-visible{color:var(--title-hi);border-color:rgba(232,239,232,.55)}
.chead{text-align:center;margin:4rem 0 3.5rem}
.cnum{margin:0 0 1rem;font-size:1.1rem;letter-spacing:.3em;margin-right:-.3em;color:var(--sub)}
.ctitle{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(1.4rem,4.2vw,2.3rem);
  letter-spacing:.06em;line-height:1.3;color:var(--title);text-shadow:0 0 24px rgba(216,223,216,.12)}
.prose{flex:1;width:100%;font-size:clamp(1.2rem,2.3vw,1.4rem);line-height:1.25;color:var(--body)}
.prose p{margin:0 0 .67em;white-space:pre-wrap;tab-size:3em;hyphens:manual}
.prose p.in{text-indent:3em}
.prose p.c{text-align:center}
.prose p.r{text-align:right}
.prose p.j{text-align:justify}
.prose b{font-weight:700}
.prose i{font-style:italic}
.prose .brk{text-align:center;color:var(--dim);letter-spacing:.5em;margin:2rem 0}
.prose em{font-style:italic;color:var(--title-hi)}
.prose strong{font-weight:700;color:var(--title-hi)}
.pager{display:flex;flex-wrap:wrap;gap:1rem;width:100%;margin-top:3rem}
.pager a{display:block;flex:1 1 15rem;min-width:0;overflow-wrap:anywhere;padding:.9rem 1.2rem;text-align:center;border:1px solid rgba(185,195,184,.3);border-radius:2px;color:var(--sub);text-decoration:none;font-size:1.1rem;line-height:1.35;transition:color .25s,border-color .25s}
.pager a small{display:block;margin-bottom:.25rem;font-size:.95rem;letter-spacing:.04em;color:var(--dim)}
.pager a:hover,.pager a:focus-visible{color:var(--title-hi);border-color:rgba(232,239,232,.55)}
.pager .next{margin:0}

@media (prefers-reduced-motion:reduce){
  h1,.reader{animation:none}
  .prompt span{animation:none;opacity:.9}
  .slot,.menu{transition:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="col">
    <h1><span class="pre">Origins of a</span><span class="main">Lone Warrior</span></h1>
    <p class="prompt"><span>– Press any key to continue –</span></p>
    <div class="slot"><nav aria-label="Chapters"><ul class="menu" id="menu"></ul></nav></div>

</div>

    <div class="prose" id="prose"></div>
    <nav class="pager" id="pager" aria-label="Chapter navigation"></nav>
  </div>
</article>

<script>
/* ============ YOUR NOVEL ============
   One entry per chapter, in reading order.
   Paragraphs are separated by a blank line. *word* makes italics, **word** makes bold.
   A line holding only * * * makes a scene break.
   Chapters converted from a Word file use html: instead of text:, which keeps the
   document's paragraph gaps, indents, blank lines, bold and italics as written.
   Until the real text goes in, each chapter is a blank page. */
function placeholder(n){
  return '';
}
var CHAPTERS=[
  {n:0,title:'Humble Beginnings',html:`<p class="in j">The sounds of the sea eased me deeper into my slumber, in my vivid dream I saw another ship coming closer into the vicinity of ours. I could hear chanting… “We’re masters of the oceans wide~ custodians of relentless tide~ for the authority we fight~ within this dark a blazing light- Hurrah, hurrah, three cheers for the cause~” Sung by the people onboard the ship.</p>
<p class="j">I see their ship shooting Canon balls directly aimed towards our ship.</p>
<p class="in j">*<i>BOOM-*</i></p>
<p class="j">Everything suddenly turns pitch black, and I wake up to the voice of-</p>
<p class="e">&nbsp;</p>
<p class="j">“Rise and shrine Crew! The shores of Erisia are well within our sights.”</p>
<p class="j">I wake up to the words of someone familiar to me, I should go down to the ship’s lower deck to look for the voice that called me.</p>
<p class="j">When I got to the lower deck, I saw Cap’n Beckham waiting for me. “Feeling caught in the waves this morning, Ali? Yer late for your trainin’! Draw your sword and let’s get a move on.” He says</p>
<p class="j">“Oh, my apologies Cap’n”, I muttered as he readies the equipment for today’s training.</p>
<p class="j">This time he aids me in refining my overall swordsmanship as well as training me to be physically stronger, to prepare for any looming danger that we might come across in the island of Erisia.</p>
<p class="j">“There ya go mate! Lookin’ sharp already! Keep this up and ye’ll be ready to take on the dangers of the land and sea alone!”</p>
<p class="j">“Are there other ways for me to train?” I ask</p>
<p class="j">“You could grab some of those gear I left in the gear cabinet and get some solo trainin’ in. He remarks.<b> </b><b>“</b>But enough of that, let’s not keep your crewmates waitin’.”</p>
<p class="j">Very well, Cap’n</p>
<p class="j">We both went up to the main deck of the ship to meet with the other crewmates.</p>
<p class="j">“Nothing quite like the smell of the sea, aye? Ye did great in yer training today, Altrius. Ye can take a moment to chat with yer fellow crewmates if ye like, just come back my way when you’ve had enough.”</p>
<p class="j">I then go to chat with a few of my crewmates.</p>
<p class="e">&nbsp;</p>
<p class="j">“Oi’ve got… urgh. Oi need, a moment. Oi’ll be fine. Exclaimed by the mate sitting in a corner of the deck.</p>
<p class="j">“What’s wrong, Pete?”</p>
<p class="j">“Th’ waves aren’t kind to me gut, Ali. Gah, ol Frank tried feeding me a mushy stew, but- urgh. Tis not a help. Th’ stew beckons my downfall. Ali.” Pete explains</p>
<p class="j">“You should rest up, go inside the cabins, sitting in a corner like this won’t help your gut.”</p>
<p class="in j">*<i>The man gives a weak thumbs-up toward you, clutching his stomach with the other hand*</i></p>
<p class="j">From the middle of the ship, you hear: “Aye Altrius!”</p>
<p class="j">I turn around and see it’s the first mate of the crew. “Oh Filigree, what’s up?”</p>
<p class="j">“Tis great to see you again. Apologies for devastating ye in our last spar, I heard Beckham ramblin’ about it from ‘ere. He said somethin’ about fearin’ for yer ability to live in Etrea with that display.” She says while having this devious smile on her face.</p>
<p class="j">“We just finished training, I won’t go down that easily anymore.”</p>
<p class="j">“Perfect! Maybe someday you can attain and master an <b>attunemen</b><b>t</b>– oh I see Beckham tryna call for you, ye should probably return to him”</p>
<p class="j">Oh alright, I gotta go then.</p>
<p class="e">&nbsp;</p>
<p class="j">“Ye get a good enough chinwag out there, then?” Beckham asks.</p>
<p class="j">“Yeah, I think so.”</p>
<p class="j">“As I was sayin’ earlier, you’ll have an opportunity to take up new <b>Talents. </b>You may also take up what’re known as <b>Mantras. </b>They’re fragments of the <b>Song </b>that ye can call upon to wield in battle. Ye’ll surely come across them as ye increase your power.”</p>
<p class="j">*As he explained, I understood the basics of chanting mantras. I then try to channel my <b>Ether </b>to my hand and aimed towards the empty sea.*</p>
<p class="in j">*<i>Crack</i><i>*</i><i> *Crackle*</i>, suddenly a burst of icicles comes out of my palm.</p>
<p class="j">“Pwoah! Yer a natural, mate. Seems like all my training is finally paying off, eh?”</p>
<p class="j">“What’s Next?”</p>
<p class="j">“Heh, well next up we have my favor-“</p>
<p class="j">We both suddenly heard the sounds of canons firing and chanting, eerily similar to the one I heard in my dream.</p>
<p class="j">“No… The Authority couldn’t have… EVERYONE GET BELOW THE DECK, NOW!”</p>
<p class="in j">*<i>BOOM-*</i></p>
<p class="j">My vision then fades to black. We didn’t have time to do anything. Why didn’t we see the Authority’s ship looming closer and closer to ours? I can feel burns and bruises all over my body. Did the ship get destroyed that quickly? God I can’t even open my eyes to see-. I then lose my consciousness…</p>`},
  {n:1,title:'The Castaway',html:`<p class="in j" style="line-height:1.45">My new journey with the crew had barely even started and it seemed to have ended before we could even reach the island we travelled days to reach. I thought it would be a smooth sail until those Authority bastards came in and ruined it all. Could we have foreseen the ambush? Hell would I know, I’m not even sure myself if I’m already in the afterlife just waiting for a light to show or if anyone from the crew even survived.</p>
<p class="j" style="line-height:1.45">A light begins to shine bright in front of me, I try to chase it and..</p>
<p class="in j" style="line-height:1.45">*<i>Arghhh*</i></p>
<p class="j" style="line-height:1.45"><i></i>I wake up in a bed in a room I don’t recognize, with half my body wrapped in bandages.</p>
<p class="j" style="line-height:1.45">“Huh? I’m alive? How lucky must I be to survive an ambush like that. How long has it been?” I mutter under my breath.</p>
<p class="j" style="line-height:1.45">I force myself to stand up and check whether there’s anyone I could talk to about my situation. I go out of my room to see a that I’m in what seems to be a sanctuary for warriors such as myself. I see someone standing near one of the pillars of the inn we were in, I’ll try asking him.</p>
<p class="j" style="line-height:1.45">“Hey, how did I end up here?” I ask the man in robes</p>
<p class="j" style="line-height:1.45">“Oh, you’re finally awake. You washed up on the shores of this isle a couple weeks ago, may I ask for your name?” Says the man</p>
<p class="j" style="line-height:1.45">“The name’s Altrius Velad, Ali for short.”</p>
<p class="j" style="line-height:1.45">He scoffs then says, “Well nice to meet you Ali, I’m Aristo, a vigil initiate of the <b>Isle of Vigils</b>.” He then asks, “Say, do you remember anything before you lost consciousness?”</p>
<p class="j" style="line-height:1.45">“I remember that I was on a ship with my crew, heading for an island before another ship shot us down.” I reply.</p>
<p class="j" style="line-height:1.45">“Do you remember your crew? Your crewmates? Or your captain” He asks again.</p>
<p class="j" style="line-height:1.45">“Now that you mention it, I don’t remember the name of our crew, any of my crewmates nor the name of my captain” I say as I try to remember something that seemed to be gone from my memories.</p>
<p class="j" style="line-height:1.45">“That’s a shame, well if you seek to find out more about your forgotten past, I suggest you regain your strength through training. The <b>Vigil</b><b>s</b><b> </b>would be more than happy to train you.”</p>
<p class="j" style="line-height:1.45">As much as I want to leave and explore the world to find out more of my past, I fear that I might be too weak for now. I should follow his advice and train before I set out for the sea</p>
<p class="j" style="line-height:1.45">“What’s the purpose for the <b>I</b><b>sle of Vigils</b>?” I ask reluctantly.</p>
<p class="j" style="line-height:1.45">“I guess I haven’t properly explained to you yet. The <b>V</b><b>igils</b> are soldiers in training, soon to be positioned in the ranks of the <b>Etris </b>army, although some decide to stay instead of going to the army, so they become swordsmen of the isle, as we are also a separate force from the Etrean army. The main purpose of the isle is to be a sanctuary for initiates and vigil soldiers alike.” He explains.</p>
<p class="j" style="line-height:1.45">“Where should I go to start my training?” I ask</p>
<p class="j" style="line-height:1.45">“Well, you can start by going to the temple sparring hall to train with the other initiates. After that you can go to the <b>Galemaster</b> to learn the art of <b>Galebreathing” </b>He replies with a generous smile on his face.</p>
<p class="j" style="line-height:1.45">“Thanks for everything, Aristo. I’ll get going now.” I say while shaking the man’s hand.</p>
<p class="j" style="line-height:1.45">“No problem, if you need anything you can come talk to me any time.”</p>
<p class="j" style="line-height:1.45">After an informative chat with Aristo, I should head to the sparring hall to start my training.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">I enter a temple in the middle of the isle where the other vigil initiates were going. I assumed I was in the right direction and went inside. I then see multiple people sparring while a man in white watches over them, I decide to approach him to inquire about training.</p>
<p class="j" style="line-height:1.45">“Hey, is this where the vigils train? If it is, may I join them?” I ask the man</p>
<p class="j" style="line-height:1.45">“Ah, you must be that <b>P</b><b>athfinder</b> the vigils found washed up on the shore. I’m the Instructor here, in charge of overseeing the initiates’ training. You may join them, go spar with Heathcliff over there, so I can see your current level of swordsmanship” He exclaims as he points to another initiate across the room.</p>
<p class="j" style="line-height:1.45">“Okay, will do Instructor.” I reply as I head towards Heathcliff.</p>
<p class="j" style="line-height:1.45">“Hey, you’re Heathcliff right? The instructor told me to spar with ya” I tell the initiate.</p>
<p class="j" style="line-height:1.45">“Huh? Oh, you must be my new sparring partner. Haven’t seen yer face before, do tell, what’s yer name lad?” He asks with an arrogant tone to his voice</p>
<p class="j" style="line-height:1.45">“Name’s Ali, I just woke up from a coma not too long ago. A vigil directed me here.” I reply</p>
<p class="j" style="line-height:1.45">“Well Ali, let’s see how ye fair up against me. Get a sword from the rack, put on yer protective gear and let’s dance” He says with the same arrogant yet confident tone in his voice.</p>
<p class="j" style="line-height:1.45">We then began sparring…</p>
<p class="in j" style="line-height:1.45"><i>*C</i><i>lank* *crash* *thud*</i></p>
<p class="j" style="line-height:1.45">These sounds of parrying and slashing echoed through the temple as we had nearly finished up our clash. Our broadswords collided in a bind after a furious flurry of strikes from Heathcliff.</p>
<p class="j" style="line-height:1.45">“Not bad, eh? Yer defense is pretty good! You sure you don’t want to go on offense?” He screamed</p>
<p class="j" style="line-height:1.45">I scoff as I was merely sizing him up to see how he fights.</p>
<p class="j" style="line-height:1.45">	<i>*Crash*</i><i></i></p>
<p class="j" style="line-height:1.45">He then comes in even faster with more slashes, trying to overwhelm my guard. I parried and redirected each slash to the point that he’s completely wide open for a counter from my blade.</p>
<p class="j" style="line-height:1.45"><i>	*Thud*</i></p>
<p class="j" style="line-height:1.45">Heathcliff then gets left on the ground after I thrusted my blade to his chest.</p>
<p class="j" style="line-height:1.45">“I win, Heathcliff. That was a nice spar.” I scoff</p>
<p class="j" style="line-height:1.45">He laughs then says “Not bad lad. That was a nice display of defense from ya”</p>
<p class="j" style="line-height:1.45">I help him get up from the ground and return the protective gear and swords to the racks. I should go back to the Instructor, to ask for his thoughts on that skirmish.</p>
<p class="j" style="line-height:1.45">“So, Instructor- how did I fair?” I ask him with slight confidence in my voice.</p>
<p class="j" style="line-height:1.45">“Impressive Ali, I wasn’t expecting much from someone that just came from a coma. I shall set up training regiments for both you and Heathcliff to refine your skills.”</p>
<p class="j" style="line-height:1.45">“Alright, thank you Instructor.” I replied</p>
<p class="j" style="line-height:1.45">I went to Heathcliff to share the news and we both wait for the Instructor’s regiments.</p>
<p class="c" style="line-height:1.45">*<i>After some time pass…</i>*</p>
<p class="j" style="line-height:1.45">“Ah there you two are, here’s your training sheets, I’ve written down what you both should improve on and methods on how to improve them. You both are now training partners, I believe you two have some chemistry when it comes to your fighting styles, so you two could learn a lot from each other.” The Instructor explains.</p>
<p class="j" style="line-height:1.45">“Thank you, Instructor.” We both say while bowing towards the Instructor.</p>
<p class="j" style="line-height:1.45">We then took the training sheets and agreed to rest up for today and continue tomorrow.</p>
<p class="c" style="line-height:1.45">*<i>Two</i><i> month</i><i>s</i><i> later*</i></p>
<p class="j" style="line-height:1.45">Can’t believe it’s already been a whole 2 months since I started training and living in this Isle. I’ve honed my skills and built strong relationships with my peers. Me and Heathcliff have already reached our goals in our training regiments and we have decided to part ways for now to learn different <b>attunements</b><b>, </b>talents, and abilities.</p>
<p class="j" style="line-height:1.45">After bidding farewell to my training buddy, I went and greeted Aristo.</p>
<p class="j" style="line-height:1.45">“Hey Aristo, its been a while.” I say to him with joy in my voice.</p>
<p class="j" style="line-height:1.45">“You caught me off guard there, Ali. I assume you’ve completed your training in the temple?” He asks</p>
<p class="j" style="line-height:1.45">“Yea I’ve already finished everything on my list. Anyway, I came to ask about the <b>attunements</b>.”</p>
<p class="j" style="line-height:1.45">“Oh, you want to attain one I presume? To put it bluntly, they are elemental powers that manipulate different parts of your surroundings and body to expel its specific effect. There are four main attunements that one can attain. <b>Flamecharm</b>, the ability to ignite the ether in your body to shoot out flames. <b>Galebreath</b>, the power to control the air around you and the air inside your lungs.</p>
<p class="j" style="line-height:1.45"><b>Frostdraw</b>, the controlling of temperature by rapidly freezing the air around you. And lastly, <b>Thundercall</b>, it works by taking energy and turning it into electricity, it could be kinetic energy, energy from magnetic fields and other sources.</p>
<p class="j" style="line-height:1.45">That concludes the main four, there are more that are manmade, and some are even born with theirs. As I said last time, you can go to Galemaster Frisk if you wish to learn more about galebreath. She resides in a camp near the outskirts of the isle. You could also go to the city of <b>E</b><b>tris</b> to seek the Frostdraw master. For the other attunements you must seek out the masters for yourself.”</p>
<p class="j" style="line-height:1.45">As he explained everything I needed to know about attunements, I pulled out a notebook to write notes down so I can’t forget them.</p>
<p class="j" style="line-height:1.45">“Thanks Aristo, I’ll head out to study more about this world. Where do you think I should go after attaining an attunement?”</p>
<p class="j" style="line-height:1.45">He thinks for a moment, before answering: “Erisia, you should go to the island of erisia. Rumor has it that there's riches to be found on Erisia for adventuring types like yourself, although do be careful, there’s said to be monsters there. At least, I consider you to be an adventuring type given that you were washed up on a random shore. If you find anything of interest, the local <b>Antiquarian</b> might buy it off you. You'll be able to find Erisia by sailing out from the docks.”</p>
<p class="j" style="line-height:1.45">“Alright, thanks again Aristo, you’ve helped me a lot since I washed up on this Isle. I’ll come to visit from time to time to see what’s changed and what stayed the same around here.”</p>
<p class="j" style="line-height:1.45">I walk back to the Inn while waving back to Aristo. I’ll start packing up and say my goodbyes to the vigils. It’s soothing to know that there’s still hope and kindness around this world. I think I’ll start my journey by going to the city of <b>Etris</b>, to learn more about the world and the people in it. Maybe I’ll attain frostdraw as my first attunement.</p>
<p class="j" style="line-height:1.45">I visited the temple one last time before heading out, to pay my respects to the Instructor and the other higher ups in the Vigils. I then head to the docks to ask a shipwright:</p>
<p class="j" style="line-height:1.45">“How much is it for a sloop? And do you know which direction to sail in to reach Etris?</p>
<p class="j" style="line-height:1.45">“A sloop’s 50 notes my friend. Etris is east from the isle, keep sailing in that direction and you should find a gate leading to the city. You can have this map to aid you in your voyage.” He replies</p>
<p class="j" style="line-height:1.45">“Alright, I’ll take a sloop. And thanks for the directions.”</p>
<p class="j" style="line-height:1.45">As the shipwright sets up the sloop. I look at the map and mark the path I should sail.</p>
<p class="j" style="line-height:1.45">Finally, my actual journey begins here. I still don’t remember anything about my life before the ambush on my crew. Maybe I’ll find out soon if I ask locals about that attack, but that doesn’t matter at the moment. What matters is I get to Etris safe, get the information I need about the world’s current state and head back out towards Erisia, an island said to be full of riches and eerie danger. I’ll take the risk so I can become stronger and wiser in this forsaken world..</p>`},
  {n:2,title:'Beginning of a New Voyage',html:`<p class="j" style="line-height:1.45">	The sea breeze travels along my vigil robes and my restless body. It’s been 2 hours or so since I started my voyage towards the city of Etris. I keep seeing these strange whirlpools around me, it’s probably best to avoid them as I don’t know where they could take me. This fog has also been bothering me the entire trip, I can’t see a damn thing out here, it’s good that my compass still works though. Thankfully I still know how to steer a ship, and from my estimates, I should reach the gate leading to the city in about thirty minutes…</p>
<p class="c" style="line-height:1.45"><i>*20 minutes pass*</i></p>
<p class="j" style="line-height:1.45">I finally see an outline of a large sea gate it feels like I’ve been lost at sea for hours on end. Welp I should speed up and go there as soon as possible, I’m really hungry..</p>
<p class="j" style="line-height:1.45">I went through the gate and saw a city built atop mountains. I didn’t think Etris was going to be this large. I docked my sloop at their shore and greeted their shipwright:</p>
<p class="j" style="line-height:1.45">“Good afternoon fellow etrean, may I ask, where is the path toward the main city of Etris?”</p>
<p class="j" style="line-height:1.45">The shipwright happy to see another person visit Etris says: “Ah good afternoon to you as well, I assume from your attire that you’re a vigil swordsman, yes? The city of Etris welcomes thee, you may follow the path to the left of us to reach the main city.”</p>
<p class="j" style="line-height:1.45">I thank him for the warm welcome and proceed to follow the path he directed me towards to reach the city. As I eventually reach the main city, I mutter:</p>
<p class="j" style="line-height:1.45">“Woah, this city’s huge, the architecture looks really intricate. I wonder how they were able to build this in the mountains.”</p>
<p class="j" style="line-height:1.45">Well, I should start by finding the inn here, I might spend a couple days here seeing how big the city is, I might need more time to explore it.</p>
<p class="j" style="line-height:1.45">I then take a few minutes to find the inn, I saw a weapon’s store, a bookstore, a blacksmith, and a restaurant called Lance’s Food. I’ll keep their locations in mind since I might need to visit all of them. After a couple more minutes I eventually find the inn, it was right across from the bookstore, I wonder how I didn’t notice it maybe I need to get my eyesight checked too…</p>
<p class="j" style="line-height:1.45">I then go inside the inn and meet the innkeeper:</p>
<p class="j" style="line-height:1.45">“Hello, I’d like to book a room here.” I told the woman at the front desk.</p>
<p class="j" style="line-height:1.45">“Sure, there’s a free room up in the third floor. We usually charge 5 notes for a room but seeing as you’re a vigil swordsman, we can book you one for free.” She says in a welcoming tone.</p>
<p class="j" style="line-height:1.45">“Ah, it seems like being one of the vigils has its many perks when residing in Etris. Thanks for the accommodation, miss.” I reply.</p>
<p class="j" style="line-height:1.45">After getting myself a room I went to check out Lance’s Food, Lance himself was a pretty cheerful guy, he really put pride in his cooking and it was evident when I took the first bite on his Megurger.</p>
<p class="j" style="line-height:1.45">I then went to the weaponry and bought myself a new Zweihander, since the sword I got from the vigils has already been beaten up after training with it for a month without doing any maintenance.</p>
<p class="j" style="line-height:1.45">I think I should go back to my accommodation and rest up for the day, I’m going to need a clear mind when I inquire about the city’s history and any mystery behind the island of Erisia. First thing I’ll do tomorrow is go to the bookstore it’s probably the best place to get that information, they might have books about these islands.</p>
<p class="j" style="line-height:1.45">And so, I went back to my room and rested for the day.</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="c" style="line-height:1.45">*<i>10 Hours Later*</i></p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">	<i>*yawn* *sigh*</i></p>
<p class="j" style="line-height:1.45">“It’s morning already? I fell asleep pretty fast, I guess it’s because I was tired from my voyage to get here” I mutter as I still feel sleepy.</p>
<p class="j" style="line-height:1.45">I dragged my still tired body towards the bookstore. There I met the bookkeeper.</p>
<p class="j" style="line-height:1.45">“Hey, do you know any history about this city?” I questioned.</p>
<p class="j" style="line-height:1.45">“Uhh hello?” I suppose the bookkeeper was lost in thought.</p>
<p class="j" style="line-height:1.45">“Oh! Uh, hello. Pardon me, I was rather deep in thought.”</p>
<p class="j" style="line-height:1.45">*Well, my assumption was right about that…*</p>
<p class="j" style="line-height:1.45">“About what?” I questioned again.</p>
<p class="j" style="line-height:1.45">“These old books are more of a passing fancy of mine, but I've heard there's an order of scholars that devote their life to researching the <b>O</b><b>ld world</b>.” He exclaims.</p>
<p class="j" style="line-height:1.45">“Is there anything you can tell me about Etris?”</p>
<p class="j" style="line-height:1.45">“If you head past the inn, you'll find the Lord Regent's estate. I wouldn’t advise entering without an invitation, however. Even a bookish fool such as myself knows when I am not welcome.” He answered in reply.</p>
<p class="j" style="line-height:1.45">“Who is this Lord Regent exactly?”</p>
<p class="j" style="line-height:1.45">“The Lord Regent is the 'acting regent' of Etrea. That is to say, he is not the prophesied King, but he still holds absolute power over Etrea. In recent years, he has sequestered himself away in his palace, rarely making an appearance. Some worry that he has grown ill, but considering that his duties have not been passed on to any of his officials, I doubt this is the case.” He explains.</p>
<p class="j" style="line-height:1.45">*I have a weird feeling about this “regent” that rules over etrea, he seems oddly mysterious for someone leading a kingdom like this. It’s best that I don’t investigate this yet. I haven’t even endured my first actual skirmish, yet.*</p>
<p class="j" style="line-height:1.45">“Do you know anything about Erisia?” I ask</p>
<p class="j" style="line-height:1.45">“Well, it was said to be a driftland. An island that moves in and out of the said <b>Voidsea</b>. The <b>Voidsea</b> itself is dangerous to any sailor, as it covers the surrounding sea of the <b>Luminants</b> and will appear when you sail too far off from the surrounding islands. If you start seeing fog and whirlpools around you, you might be inside of the most dangerous part of these oceans.”</p>
<p class="j" style="line-height:1.45">*So, I was in the voidsea when I saw those whirlpools and when I was encompassed in a thick fog. I’m impressed that I didn’t see anything else weird about it.*</p>
<p class="j" style="line-height:1.45">“I heard Erisia was a land with riches in it, I was hoping to get there and snag some so I could better my gear.” I say to the bookkeeper.</p>
<p class="j" style="line-height:1.45">With a surprised look in his face, he muttered: “You’re brave to think that you can just go there and grab some of its riches and leave without a scratch. That land has lost to time, its now made a battleground for warriors who know not why they fight.”</p>
<p class="j" style="line-height:1.45">With a delighted look in my eyes, I said: “It seems to me that it’s just another challenge for me to conquer. Thanks for the knowledge old man, I now know what to do next”</p>
<p class="j" style="line-height:1.45">And that that thing I needed to do was go to Erisia and see the lurking danger in it for myself. Although I still have things to do here in Etris before I go, one of them being, finding the master of frost to see if I have what it takes to attain Frostdraw for myself. As well as ask around if anyone knew about the authority ambushing a crew ship, I still need to know what really happened that day.</p>
<p class="j" style="line-height:1.45">After thanking the bookkeeper, I went to ask around if people knew anything about the ambush, but to no avail. I guess I have to put that thought in the back of my mind for now.</p>
<p class="j" style="line-height:1.45">I saw an etrean guard standing near the path leading to the regent’s palace, maybe I should go ask him about where to find the master of frost.</p>
<p class="j" style="line-height:1.45">“Hey sir, do you know where the master of frost resides?” I asked</p>
<p class="j" style="line-height:1.45">“Oh, you’re looking to learn Frostdraw? Well, she resides in the Alchemist’s Lodge, go to the middle of the city and take a left you should see a path up and around a mountain near the general store. That path should take you to the lodge.”</p>
<p class="j" style="line-height:1.45">I nodded and shook his hand in thanks. I then followed his directions to see the master.</p>
<p class="j" style="line-height:1.45">I entered the lodge to be greeted by her:</p>
<p class="j" style="line-height:1.45">“Can you really protect anything that you hold dear as you are now?” She asks</p>
<p class="j" style="line-height:1.45">“What do you mean?”</p>
<p class="j" style="line-height:1.45">“You lack the means to protect anything at all. I can teach you how. Will you take up the mantle of the Frostdrawer?”</p>
<p class="j" style="line-height:1.45">Thrilled, I excitedly asked: “Yes, what would you have me do?”</p>
<p class="j" style="line-height:1.45">“Bring me five<b> </b>Frigid Prisms, then we can continue. These could be found in the stashes of nomads located in Erisia.”</p>
<p class="j" style="line-height:1.45">I nodded in agreement. afterwards I went back to my room in the inn to pack up so I can set sail towards Erisia. With all the necessary preparations done, I went to the docks, bid farewell to the shipwright, marked my path and went on another voyage, this time to Erisia. The thrill of finally stepping foot in that land makes me itch for battle against any danger that I might come across there. And the mystery behind it makes it even better for my desire to explore this world.</p>`},
  {n:3,title:'Driftland of The Voidsea',text:placeholder(3)},
  {n:4,title:'Below The Sea, Layer 1: Thalassophobia',text:placeholder(4)},
  {n:5,title:'Even Deeper, Layer 2: The Ethereal Chill',text:placeholder(5)}
];

(function(){
  var body=document.body, menu=document.getElementById('menu'), reader=document.getElementById('reader');
  var BOOK='Origins of a Lone Warrior', open=false, idx=0, links=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  CHAPTERS.forEach(function(c){
    var li=document.createElement('li'), a=document.createElement('a');
    a.href='#chapter-'+c.n; a.textContent='Chapter '+c.n+': '+c.title;
    li.appendChild(a); menu.appendChild(li); links.push(a);
  });
  links.forEach(function(a,i){
    a.addEventListener('mouseenter',function(){setOn(i)});
    a.addEventListener('focus',function(){setOn(i)});
  });

  function setOn(i){
    idx=(i+links.length)%links.length;
    links.forEach(function(a,n){a.classList.toggle('on',n===idx)});
  }
  function openMenu(){ if(open) return; open=true; body.classList.add('menu-open'); }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,' ')}
  function render(text){
    return text.split(/\n\s*\n/).map(function(p){
      p=p.trim(); if(!p) return '';
      if(/^(\*\s*\*\s*\*|---)$/.test(p)) return '<div class="brk" aria-hidden="true">* * *</div>';
      return '<p>'+fmt(p)+'</p>';
    }).join('');
  }

  var current=-1;
  function show(i){
    var c=CHAPTERS[i], prev=CHAPTERS[i-1], next=CHAPTERS[i+1];
    current=i; body.classList.add('reading');
    document.getElementById('cnum').textContent='Chapter '+c.n;
    document.getElementById('ctitle').textContent=c.title;
    document.getElementById('prose').innerHTML=c.html||render(c.text);
    var pg='';
    if(prev) pg+='<a class="prev" href="#chapter-'+prev.n+'"><small>Previous chapter</small>Chapter '+prev.n+': '+esc(prev.title)+'</a>';
    if(next) pg+='<a class="next" href="#chapter-'+next.n+'"><small>Next chapter</small>Chapter '+next.n+': '+esc(next.title)+'</a>';
    document.getElementById('pager').innerHTML=pg;
    document.title='Chapter '+c.n+': '+c.title+' | '+BOOK;
    reader.scrollTop=0; reader.focus({preventScroll:true});
  }
  function home(){
    var was=body.classList.contains('reading');
    body.classList.remove('reading'); current=-1; document.title=BOOK;
    if(was) openMenu();
  }
  function route(){
    var m=/^#chapter-(\d+)$/.exec(location.hash), i=-1;
    if(m) CHAPTERS.forEach(function(c,n){ if(String(c.n)===m[1]) i=n; });
    if(i>=0) show(i); else home();
  }
  window.addEventListener('hashchange',route);

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(current>=0){
      if(e.key==='Escape') location.hash='#chapters';
      else if(e.key==='ArrowLeft'&&CHAPTERS[current-1]) location.hash='#chapter-'+CHAPTERS[current-1].n;
      else if(e.key==='ArrowRight'&&CHAPTERS[current+1]) location.hash='#chapter-'+CHAPTERS[current+1].n;
      return;
    }
    if(!open){ if(e.key==='Shift'||e.key==='Tab') return; e.preventDefault(); openMenu(); return; }
    if(e.key==='ArrowDown'){e.preventDefault(); setOn(idx+1); links[idx].focus({preventScroll:true});}
    else if(e.key==='ArrowUp'){e.preventDefault(); setOn(idx-1); links[idx].focus({preventScroll:true});}
    else if(e.key==='Enter'&&document.activeElement!==links[idx]){e.preventDefault(); location.hash=links[idx].getAttribute('href');}
  });
  document.getElementById('stage').addEventListener('click',openMenu);

  route();

  /* Drifting dust */
  var cv=document.getElementById('dust'), cx=cv.getContext('2d'), P=[], W=0, H=0;
  function size(){
    var d=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0);
  }
  function seed(){
    P=[]; var n=Math.round(Math.min(70,W*H/16000));
    for(var i=0;i<n;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,
      vx:(Math.random()-.5)*.12,vy:-.03-Math.random()*.12,a:.04+Math.random()*.2,t:Math.random()*6.28});
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      if(!still){p.x+=p.vx; p.y+=p.vy; p.t+=.012;
        if(p.y<-4)p.y=H+4; if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;}
      cx.globalAlpha=p.a*(0.6+0.4*Math.sin(p.t));
      cx.fillStyle='#D8DFD8';
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  size(); seed(); draw();
  window.addEventListener('resize',function(){size(); seed(); if(still) draw();});
})();
</script>
</body>
</html>
