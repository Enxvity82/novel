<p class="j" style="line-height:1.45">But I come to the realization that it is normal. It was said to them clearly and repeatedly that this faction had a ninety percent mortality rate. They still enlisted anyway with their own sets of goals and ideals. It’s just depressing to think that, that’s the case for these young adventurers. I sometimes forget that this world is genuinely unforgiving for those unprepared…</p>
<p class="e" style="line-height:1.45">&nbsp;</p>
<p class="j" style="line-height:1.45">One day, Klaris calls for both me and Heathcliff to go to the entrance of the <b>Second Layer</b><b>.</b></p>
<p class="j" style="line-height:1.45">“Ah there you two are, listen up I need some competent people to explore an anomaly.” She says.</p>
<p class="j" style="line-height:1.45">“We lost an expedition team heading into the Second Layer. We sent one of our Black Divers, <b>Chaser</b>, down with about twenty experienced Divers. Something seems to have gone wrong down there - it's not normal for him to not report back.</p>
<p class="j" style="line-height:1.45">We had reports from our scouts that powerful reverberations of the <b>Song</b> were coming from a passage within one of the Ethironal Sanctuaries. We think this might have clues to the resting place of <b>Ethiron</b>.” She adds.</p>
<p class="j" style="line-height:1.45">“Who do you mean by Ethiron?” We ask her in unison</p>
<p class="j" style="line-height:1.45">“The <b>Drowned God </b>of the<b> Eternal Gale</b>. The one responsible for not only the harsh conditions of the <b>Second Layer</b>, but also possibly the key we need to further understand the Depths itself.”</p>
<p class="j" style="line-height:1.45">“So, where does that leave us?” I asked</p>
<p class="j" style="line-height:1.45">“We can't afford to keep sending more Divers down, we're thin on our numbers as it is. I will bless you both with a ‘<b>Light Hook</b>' so you can make your way down.”</p>
<p class="j" style="line-height:1.45">“A Light Hook? What’s that?” Heathcliff asks.</p>
<p class="j" style="line-height:1.45">“The <b>Light Hook </b>is a special technique of the <b>Radiant Tones</b>. It will allow me to pull you back up from below should you suffer fatal injuries while it's active. Beware, as it will only last a maximum of twenty minutes once you enter the Layer. If you suffer fatal wounds after that time runs out... I'm afraid you'll have to take fate into your own hands” She explains.</p>
<p class="j" style="line-height:1.45">“These Radiant Tones you speak of, they are a Verse of the Song that can reproduce Light. With this light you found a way to use it against the depths. Right?” I responded</p>
<p class="j" style="line-height:1.45">“Hmm, you must’ve read the entirety of the journal Heathcliff gave you, no? Not that many Divers even know about the Radiant Tones since they don’t read the journal all the way through. They always ask me about it, it bothers me sometimes.” She grinned.</p>
<p class="j" style="line-height:1.45">We then took some time to think about this expedition…</p>
<p class="j" style="line-height:1.45"><i>Something tells me that Chaser, the Black Diver sent down with the others, is doing some shady stuff in the Second Layer that we have no idea of. And this Drowned God </i><i>Klaris</i><i> mentioned, from the journal I read, it said that</i><i>, “</i></p>
<p class="j" style="line-height:1.45"><i>“</i><i>T</i><i>he Drowned Gods </i><i>are immensely powerful beings that are in a permanent slumber within </i><i>The Depths. </i><i>They are so powerful that their mere existence causes reality to warp</i><i>.</i><i>”</i></p>
<p class="j" style="line-height:1.45"><i>I bite my tongue at the thought that we could see one awaken, but I should focus on our mission. To find out what happened to the divers sent down here.</i><i> Heathcliff </i><i>seemed</i><i> </i><i>to have</i><i> had the same thoughts as me.</i></p>
<p class="j" style="line-height:1.45">After taking everything in, the both of us decide that-</p>
<p class="j" style="line-height:1.45">“We’re ready to venture into the Eternal gale.” We announced to Klaris.</p>
<p class="j" style="line-height:1.45">“A Light Hook’s already active, stand within the circle and ready yourselves. Good luck out there you two are the highest valued Divers we have, so please, don’t get lost.” She muttered in a worrying tone.</p>
<p class="j" style="line-height:1.45">We then see light shine upon us as we delve deeper into the depths, into the Eternal Gale…</p>`,music:'Y3lF2hL5geg',theme:'abyss'},

(function(){
  var body=document.body, menu=document.getElementById('menu'), reader=document.getElementById('reader');
  var BOOK='Origins of a Lone Warrior', open=false, idx=0, links=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function slug(c){return c.slug||'chapter-'+c.n}
  function label(c){return c.label||('Chapter '+c.n+': '+c.title)}
  CHAPTERS.forEach(function(c){
    var li=document.createElement('li'), a=document.createElement('a');
    a.href='#'+slug(c); a.textContent=label(c);
    li.appendChild(a); menu.appendChild(li); links.push(a);
  });
  links.forEach(function(a,i){
    a.addEventListener('mouseenter',function(){setOn(i)});
    a.addEventListener('focus',function(){setOn(i)});
  });

  function setOn(i){
    idx=(i+links.length)%links.length;
    links.forEach(function(a,n){a.classList.toggle('on',n===idx)});
  }
  function openMenu(){ if(open) return; open=true; body.classList.add('menu-open'); }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,' ')}
  function render(text){
    return text.split(/\n\s*\n/).map(function(p){
      p=p.trim(); if(!p) return '';
      if(/^(\*\s*\*\s*\*|---)$/.test(p)) return '<div class="brk" aria-hidden="true">* * *</div>';
      return '<p>'+fmt(p)+'</p>';
    }).join('');
  }

  var HOME_TRACK='pnZDFSxpOYY', DELAY=3000;
  var wrap=document.getElementById('music'), mbtn=document.getElementById('mbtn');
  var track=null, wanted=null, want=true, timer=null, activated=false;
  function stopTrack(){ wrap.textContent=''; track=null; }
  function playTrack(id){
    if(!id||(track===id&&wrap.firstChild)) return;
    stopTrack();
    var f=document.createElement('iframe');
    f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&controls=0&playsinline=1';
    f.allow='autoplay; encrypted-media'; f.title='Background music'; f.tabIndex=-1;
    wrap.appendChild(f); track=id;
  }
  /* Each page has its own track. It starts DELAY ms after the page opens. Browsers refuse
     sound until the reader has pressed a key or clicked, so before that the delay restarts
     on the first key press or click. */
  function arm(){
    clearTimeout(timer);
    timer=setTimeout(function(){ if(wanted&&want&&activated) playTrack(wanted); },DELAY);
  }
  function setMusic(id){
    wanted=id; clearTimeout(timer);
    if(id!==track) stopTrack();
    if(id&&want) arm();
  }
  function syncBtn(){ mbtn.textContent='Music: '+(want?'on':'off'); mbtn.setAttribute('aria-pressed',String(want)); }
  mbtn.addEventListener('click',function(){
    want=!want; syncBtn(); activated=true;
    if(want) playTrack(wanted); else { clearTimeout(timer); stopTrack(); }
  });
  function activate(){ if(activated) return; activated=true; if(wanted&&want&&!track) arm(); }
  ['pointerdown','keydown','touchstart'].forEach(function(t){
    document.addEventListener(t,activate,{capture:true,passive:true});
  });

  var current=-1;
  function show(i){
    var c=CHAPTERS[i], prev=CHAPTERS[i-1], next=CHAPTERS[i+1];
    current=i; body.classList.add('reading');
    body.classList.remove('t-abyss','t-chill'); if(c.theme) body.classList.add('t-'+c.theme);
    setMusic(c.music);
    var cn=document.getElementById('cnum'); cn.textContent=c.slug?'':'Chapter '+c.n; cn.style.display=c.slug?'none':'';
    document.getElementById('ctitle').textContent=c.title;
    document.getElementById('prose').innerHTML=c.html||render(c.text);
    var pg='';
    if(prev) pg+='<a class="prev" href="#'+slug(prev)+'"><small>'+(prev.slug?'Previous page':'Previous chapter')+'</small>'+esc(label(prev))+'</a>';
    if(next) pg+='<a class="next" href="#'+slug(next)+'"><small>'+(next.slug?'Next page':'Next chapter')+'</small>'+esc(label(next))+'</a>';
    document.getElementById('pager').innerHTML=pg;
    document.title=label(c)+' | '+BOOK;
    reader.scrollTop=0; reader.focus({preventScroll:true});
  }
  function home(){
    var was=body.classList.contains('reading');
    body.classList.remove('reading','t-abyss','t-chill'); current=-1; document.title=BOOK; setMusic(HOME_TRACK);
    if(was) openMenu();
  }
  function route(){
    var i=-1;
    CHAPTERS.forEach(function(c,n){ if('#'+slug(c)===location.hash) i=n; });
    if(i>=0) show(i); else home();
  }
  window.addEventListener('hashchange',route);

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(document.activeElement===mbtn&&(e.key==='Enter'||e.key===' ')) return;
    if(current>=0){
      if(e.key==='Escape') location.hash='#chapters';
      else if(e.key==='ArrowLeft'&&CHAPTERS[current-1]) location.hash='#'+slug(CHAPTERS[current-1]);
      else if(e.key==='ArrowRight'&&CHAPTERS[current+1]) location.hash='#'+slug(CHAPTERS[current+1]);
      return;
    }
    if(!open){ if(e.key==='Shift'||e.key==='Tab') return; e.preventDefault(); openMenu(); return; }
    if(e.key==='ArrowDown'){e.preventDefault(); setOn(idx+1); links[idx].focus({preventScroll:true});}
    else if(e.key==='ArrowUp'){e.preventDefault(); setOn(idx-1); links[idx].focus({preventScroll:true});}
    else if(e.key==='Enter'&&document.activeElement!==links[idx]){e.preventDefault(); location.hash=links[idx].getAttribute('href');}
  });
  document.getElementById('stage').addEventListener('click',openMenu);

  route();

  /* Drifting dust */
  var cv=document.getElementById('dust'), cx=cv.getContext('2d'), P=[], W=0, H=0;
  function size(){
    var d=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0);
  }
  function seed(){
    P=[]; var n=Math.round(Math.min(70,W*H/16000));
    for(var i=0;i<n;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,
      vx:(Math.random()-.5)*.12,vy:-.03-Math.random()*.12,a:.04+Math.random()*.2,t:Math.random()*6.28});
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      if(!still){p.x+=p.vx; p.y+=p.vy; p.t+=.012;
        if(p.y<-4)p.y=H+4; if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;}
      cx.globalAlpha=p.a*(0.6+0.4*Math.sin(p.t));
      cx.fillStyle='#D8DFD8';
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  size(); seed(); draw();
  window.addEventListener('resize',function(){size(); seed(); if(still) draw();});
})();
</script>
</body>
</html>
